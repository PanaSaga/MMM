<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoreMush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --wood: #7a4f2e; --wood-d: #3b2414; --cream: #f6ead2; --cream-d: #e8d6b4; --ink: #3b2414;
  --ed: #f28c28; --md: #3fae4a; --ps: #9b4fd1; --gold: #f5c518; --blue: #5fb8ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120c; font-family: "Jua", "Malgun Gothic", sans-serif; color: var(--ink); user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
#cv { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.hidden { display: none !important; }
img { image-rendering: auto; }

button { font-family: inherit; font-size: 22px; color: var(--ink); background: linear-gradient(#fff4dc, #f0dcb4); border: 3px solid var(--wood-d); border-radius: 16px; padding: 8px 18px; cursor: pointer; box-shadow: 0 4px 0 var(--wood-d); transition: transform .08s; white-space: nowrap; }
button:hover { transform: translateY(-2px); }
button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-d); }
button.big { font-size: 34px; padding: 12px 40px; border-radius: 22px; }
button.small { font-size: 18px; padding: 5px 12px; border-radius: 12px; }
button.go { background: linear-gradient(#ffe27a, #f5b82e); }
button.ghost { background: rgba(255,255,255,.55); }
button.danger { background: linear-gradient(#ff9a8a, #e8503a); color: #fff; }
button.disabled, button.locked { filter: grayscale(.7); opacity: .6; }
button.sprout { position: relative; }
button.sprout::after { content: '🌱'; position: absolute; right: -10px; top: -14px; font-size: 24px; animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }

.cost { display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; font-size: 19px; }
.cost img { width: 22px; height: 22px; }
.cost.lack { color: #d23a2a; }

/* 상단 재화 */
#topbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: var(--wood); border: 4px solid var(--wood-d); border-radius: 20px; padding: 8px 14px; }
.res { display: flex; align-items: center; gap: 6px; background: var(--cream); border-radius: 12px; padding: 4px 14px 4px 8px; font-size: 26px; min-width: 110px; }
.res img { width: 34px; height: 34px; }
.res.small { font-size: 22px; min-width: 80px; }
.res.small img { width: 28px; height: 28px; }
.res-sep { width: 3px; height: 34px; background: var(--wood-d); border-radius: 2px; }

#treebtns { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: space-between; padding: 0 24px; pointer-events: none; }
#treebtns > div { display: flex; gap: 14px; align-items: flex-end; pointer-events: auto; }
#treebtns button.go { font-size: 32px; padding: 14px 34px; }

#tip { position: absolute; display: none; width: 330px; background: rgba(250,240,220,.97); border: 3px solid var(--wood-d); border-radius: 14px; padding: 12px 14px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.4); font-family: "Malgun Gothic", sans-serif; }
.tip-title { font-family: "Jua", sans-serif; font-size: 26px; }
.tip-lv { font-size: 15px; color: #7a5a3a; margin-bottom: 6px; }
.tip-eff { font-size: 16px; line-height: 1.5; margin-bottom: 8px; }
.tip-cost { font-family: "Jua", sans-serif; }
.tip-max { color: #b8860b; font-family: "Jua", sans-serif; }
.tip-note { margin-top: 6px; font-size: 13px; color: #6a5a4a; }

/* 모달 */
#modal { position: absolute; inset: 0; background: rgba(20,12,6,.55); display: flex; align-items: center; justify-content: center; }
.panel { position: relative; background: var(--cream); border: 6px solid var(--wood-d); outline: 8px solid var(--wood); border-radius: 26px; padding: 26px 32px; max-width: 1800px; max-height: 1020px; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.panel h2 { margin: 0 0 6px; font-size: 42px; font-weight: normal; }
.panel h2 .count { font-size: 30px; color: #8a6a4a; }
.panel h3 { margin: 16px 0 8px; font-size: 26px; font-weight: normal; }
.panel h3 small { font-size: 17px; color: #8a6a4a; }
.panel .sub { font-family: "Malgun Gothic", sans-serif; font-size: 17px; color: #6a5040; margin-bottom: 12px; }
.xbtn { position: absolute; top: 14px; right: 14px; font-size: 22px; padding: 2px 12px; }
.res-mini { position: absolute; top: 24px; right: 80px; display: flex; gap: 14px; font-size: 24px; }
.res-mini span { display: flex; align-items: center; gap: 4px; }
.res-mini { align-items: center; }
.res-mini button.small { font-size: 17px; padding: 3px 12px; }
.res-mini img { width: 26px; }

.tabs { display: flex; gap: 10px; margin: 8px 0 14px; }
.tab { border-color: var(--c); }
.tab.on { background: var(--c); color: #fff; }

/* 종균 상점 */
.seedshop { width: 1180px; }
.seed-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.seed { background: #fffaf0; border: 3px solid #cdb68e; border-radius: 16px; padding: 10px; text-align: center; min-height: 170px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
.seed > img { width: 96px; height: 96px; }
.seed .nm { font-size: 20px; }
.seed.owned { background: #f2fbe8; border-color: #8ac06a; }
.seed.next { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(95,184,255,.3); }
.seed.hid { opacity: .6; }
.seed.focus { animation: glow 1s 3; }
.seed.pop { animation: pop .5s; }
.seed .own { font-size: 15px; color: #5a8a3a; }
.seed .price { font-size: 17px; }
@keyframes pop { 40% { transform: scale(1.15); } }
@keyframes glow { 50% { box-shadow: 0 0 0 8px rgba(255,210,60,.7); } }
.tier { font-size: 14px; padding: 1px 8px; border-radius: 8px; background: #ddd; color: #333; display: inline-block; }
.tier.t0 { background: #e4ded0; } .tier.t1 { background: #bfe2ff; } .tier.t2 { background: #ead0ff; } .tier.t3 { background: #ffe0a0; }

/* 도감 */
.codex { width: 1780px; }
.ccols { display: flex; gap: 18px; }
.ccol { flex: 1; background: #fffaf0; border-radius: 16px; padding: 10px; border: 3px solid #e2cfa8; }
.chead { font-size: 24px; color: var(--c); margin-bottom: 8px; display: flex; justify-content: space-between; }
.chead span { color: #8a6a4a; }
.cgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cc { position: relative; background: #f3ead8; border: 3px solid #d9c6a2; border-radius: 12px; padding: 3px; text-align: center; cursor: pointer; height: 98px; }
.cc > img { width: 60px; height: 60px; }
.cc .nm { font-size: 12px; line-height: 1.05; font-family: "Malgun Gothic", sans-serif; }
.cc.got { background: #fff; }
.cc.got.t1 { border-color: #7fc4ff; } .cc.got.t2 { border-color: #c77dff; } .cc.got.t3 { border-color: #ffb627; }
.cc.lock { background: #d8cdb8; }
.cc.sel { outline: 4px solid var(--blue); }
.gold-star { position: absolute; top: 2px; right: 6px; color: #e8a900; font-size: 20px; text-shadow: 0 0 4px #fff; }
.giant-mark { position: absolute; top: 4px; left: 6px; font-size: 14px; background: #7a4f2e; color: #fff; border-radius: 6px; padding: 0 4px; }
.cbottom { display: flex; gap: 18px; margin-top: 16px; }
.cdetail { flex: 1; display: flex; gap: 18px; background: #fffaf0; border-radius: 16px; padding: 14px; border: 3px solid #e2cfa8; min-height: 230px; align-items: flex-start; }
.cdetail.empty { align-items: center; justify-content: center; color: #9a8a70; font-size: 24px; }
.cdetail img.big { width: 170px; height: 170px; }
.cinfo { flex: 1; font-family: "Malgun Gothic", sans-serif; }
.cname { font-family: "Jua", sans-serif; font-size: 32px; margin-bottom: 6px; }
.catpill { font-size: 15px; background: var(--c); color: #fff; border-radius: 8px; padding: 1px 8px; }
.cdesc { font-size: 18px; margin-bottom: 8px; }
.ctrait { font-size: 16px; color: #6a3a9a; margin-bottom: 6px; }
.cwarn { font-size: 16px; color: #c0392b; font-weight: bold; margin-bottom: 6px; }
.crec { font-size: 14px; color: #7a6a5a; }
.cinfo button { margin-top: 12px; font-family: "Jua", sans-serif; }
.sets { flex: 1; background: #fffaf0; border-radius: 16px; padding: 12px 14px; border: 3px solid #e2cfa8; max-height: 360px; overflow: auto; }
.sets-h { font-size: 22px; margin-bottom: 6px; }
.setrow { display: flex; gap: 10px; align-items: baseline; font-size: 17px; padding: 3px 0; border-bottom: 1px dashed #e2cfa8; color: #8a7a6a; }
.setrow b { font-weight: normal; color: var(--ink); min-width: 120px; }
.setrow .prog { min-width: 44px; }
.setrow .eff { font-family: "Malgun Gothic", sans-serif; font-size: 14px; }
.setrow.done { color: #3a8a2a; }
.setrow.done b::before { content: '✔ '; }

/* 공방 */
.workshop { width: 1640px; }
.ws-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px; }
.potrow { display: flex; align-items: center; gap: 10px; background: #fffaf0; border-radius: 14px; padding: 8px 12px; margin-bottom: 8px; border: 2px solid #e2cfa8; }
.potrow > img { width: 48px; }
.pname { font-size: 22px; width: 130px; display: flex; flex-direction: column; }
.pname small { font-size: 15px; color: #8a6a4a; }
.precipe { flex: 1; font-size: 17px; }
.wlist { display: flex; flex-direction: column; gap: 5px; }
.wrow { display: grid; grid-template-columns: 36px 110px 1fr auto; gap: 2px 8px; background: #fffaf0; border-radius: 12px; padding: 6px 10px; border: 2px solid #e2cfa8; font-size: 17px; align-items: center; }
.wrow .wi { font-size: 26px; grid-row: span 2; }
.wrow .wd, .wrow .wf { font-family: "Malgun Gothic", sans-serif; font-size: 13px; color: #6a5040; }
.wrow .wf { grid-column: 2 / 5; }
.wrow .wc { grid-column: 4; grid-row: 1; font-size: 15px; }
.wrow.locked { opacity: .5; }
.hvgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.hvcard { background: #fffaf0; border: 3px solid #cdb68e; border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hvcard.locked { background: #efe6d4; }
.hvcard > img { width: 72px; }
.hvname { font-size: 20px; }
.hvname small { color: #b8860b; }
.hvstat { font-size: 14px; color: #6a5040; font-family: "Malgun Gothic", sans-serif; }
.hvtrait { font-size: 13px; color: #6a3a9a; font-family: "Malgun Gothic", sans-serif; min-height: 36px; }
.hvreq { font-size: 14px; color: #8a6a4a; }
.hvcard button { font-size: 15px; }
.hvcard button .cost { font-size: 15px; }
.hvcard button .cost img { width: 18px; height: 18px; }

/* 기록 */
.records { width: 640px; }
.recs { display: flex; flex-direction: column; gap: 8px; }
.recrow { display: flex; justify-content: space-between; background: #fffaf0; border-radius: 12px; padding: 10px 16px; font-size: 22px; border: 2px solid #e2cfa8; }

/* 출발 준비 */
.preround { width: 1560px; }
.picks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.picks.wgrid { grid-template-columns: repeat(4, 1fr); }
.pick { background: #fffaf0; border: 3px solid #cdb68e; border-radius: 16px; padding: 10px; text-align: center; cursor: pointer; }
.pick.on { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(95,184,255,.4); background: #eef7ff; }
.pick.locked { opacity: .45; cursor: default; }
.pick > img { width: 60px; }
.pick .pn { font-size: 20px; }
.pick .pd { font-size: 13px; color: #6a5040; font-family: "Malgun Gothic", sans-serif; min-height: 34px; }
.pick .pc { font-size: 15px; margin-top: 4px; }
.pick .wicon { font-size: 40px; }
.pre-go { text-align: center; margin-top: 20px; }
.pause { width: 560px; text-align: center; }
.pause-btns { display: flex; flex-direction: column; gap: 16px; align-items: center; margin-top: 16px; }
.chk { font-size: 20px; }

/* 전체 화면 (타이틀·정산·엔딩) */
#screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.title-box { text-align: center; background: rgba(246,234,210,.94); border: 6px solid var(--wood-d); outline: 10px solid var(--wood); border-radius: 36px; padding: 40px 80px; }
.title-box h1 { font-size: 130px; margin: 0; font-weight: normal; color: #e8452c; text-shadow: 5px 5px 0 var(--wood-d), -2px -2px 0 #fff; letter-spacing: 6px; }
.title-icons img { width: 90px; margin: 0 4px; animation: bob 1.4s infinite; }
.title-icons img:nth-child(2n) { animation-delay: .3s; }
.subtitle { font-size: 26px; color: #6a4a2a; margin-bottom: 26px; }
.title-btns { display: flex; gap: 20px; justify-content: center; align-items: center; margin-bottom: 26px; }
.howto { font-family: "Malgun Gothic", sans-serif; font-size: 16px; color: #6a5040; }
.proto { font-size: 15px; color: #9a8a70; margin-top: 8px; }

.settle, .ending { max-height: 1050px; overflow-y: auto; width: 900px; background: var(--cream); border: 6px solid var(--wood-d); outline: 10px solid var(--wood); border-radius: 32px; padding: 30px 50px; text-align: center; position: relative; }
.settle h1, .ending h1 { font-size: 72px; margin: 0 0 6px; font-weight: normal; color: #e8892a; text-shadow: 3px 3px 0 var(--wood-d); }
.basket { position: relative; height: 110px; width: 380px; margin: 0 auto 10px; background: linear-gradient(#c88b52, #8a5a2e); border: 4px solid var(--wood-d); border-radius: 0 0 60px 60px; overflow: hidden; }
.bshroom { position: absolute; top: -40px; width: 46px; animation: drop .6s cubic-bezier(.3,1.4,.6,1) forwards; opacity: 0; }
@keyframes drop { from { top: -40px; opacity: 1; } to { top: var(--y); opacity: 1; } }
.srow { display: flex; justify-content: space-between; align-items: center; font-size: 30px; padding: 8px 16px; background: #fffaf0; border-radius: 14px; margin: 8px 0; border: 2px solid #e2cfa8; }
.srow b { font-weight: normal; font-size: 40px; display: flex; align-items: center; gap: 6px; }
.srow.gold b { color: #c99a00; }
.sgains { display: flex; gap: 14px; justify-content: center; margin: 12px 0; }
.sg { flex: 1; background: #fffaf0; border: 3px solid var(--c); border-radius: 14px; padding: 8px; display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 22px; }
.sg b { font-weight: normal; font-size: 30px; color: var(--c); }
.smeta { font-size: 18px; color: #8a6a4a; }
.snew { margin: 12px 0; }
.snh { font-size: 22px; margin-bottom: 6px; }
.newcards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 190px; overflow-y: auto; padding: 10px 4px; }
.newcard { position: relative; background: #fff; border: 3px solid #8ac06a; border-radius: 14px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 20px; animation: pop .5s; }
.newcard img { width: 56px; }
.newcard i { position: absolute; top: -10px; right: -8px; background: #e8452c; color: #fff; font-style: normal; font-size: 13px; border-radius: 8px; padding: 1px 6px; }
.newcard.gold { border-color: #e8a900; background: #fff8d8; }
.srecs { margin: 10px 0; }
.recnew { font-size: 22px; color: #d2691e; }
.recnew small { color: #8a6a4a; font-size: 16px; }
.settle > button, .ending > button { margin-top: 16px; }
.ending .sub { font-size: 24px; color: #6a4a2a; }
.allicons { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; margin: 16px 0; }
.allicons img { width: 100%; }

#toast { position: absolute; left: 50%; top: 110px; transform: translateX(-50%) translateY(-20px); background: rgba(40,25,15,.9); color: #fff6e0; padding: 10px 24px; border-radius: 16px; font-size: 22px; opacity: 0; transition: .25s; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%); }
.spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; animation: spark .6s forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* 세금 (상단 바) */
.res.tax { min-width: 0; font-size: 18px; padding-right: 16px; }
.res.tax .tax-t { display: flex; flex-direction: column; line-height: 1.15; }
.res.tax .tax-t b { font-weight: normal; font-size: 22px; }
.res.tax .tax-t small { font-family: "Malgun Gothic", sans-serif; font-size: 13px; color: #7a5a3a; }
.res.tax.due { background: #ffe0c8; animation: duepulse 1.2s infinite; }
.res.tax.due.ok { background: #e4f6d4; animation: none; }
@keyframes duepulse { 50% { box-shadow: 0 0 0 5px rgba(232,69,44,.45); } }
/* 세금 고지서 */
.taxbill { width: 980px; }
.taxbill .sub b { color: #c99a00; }
.srow b.lack { color: #d23a2a; }
.srow.debt b { color: #d23a2a; }
.srow small { font-size: 16px; color: #8a6a4a; }
.taxopts { display: flex; gap: 18px; margin-top: 18px; }
.topt { flex: 1; background: #fffaf0; border: 3px solid #e2cfa8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.tnote { font-family: "Malgun Gothic", sans-serif; font-size: 16px; color: #6a5040; line-height: 1.5; }
.tnote b { color: #c0392b; }
.tresult { font-size: 34px; margin: 16px 0 8px; }
.tresult.ok { color: #3a8a2a; } .tresult.bad { color: #c0392b; }
.tresult small { font-size: 18px; color: #8a6a4a; }
/* 도감 추가 요소 */
.stars { position: absolute; bottom: 1px; left: 0; right: 0; font-size: 11px; color: #e8a900; letter-spacing: -1px; }
.stars i { font-style: normal; color: #d8ccb4; }
.cdetail .stars, .cstar .stars { position: static; font-size: 18px; }
.cstar { font-size: 16px; color: #8a6a00; margin-bottom: 6px; }
.cleft { flex: 1.3; display: flex; flex-direction: column; gap: 10px; }
.sprow { background: #fffaf0; border-radius: 16px; padding: 8px 12px; border: 3px solid #e2cfa8; }
.sprow .sets-h small { font-size: 16px; color: #8a6a4a; }
.spgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.cc.sp { height: 96px; }
.cc.sp > img { width: 60px; height: 60px; }
.cc.unl { background: #fbf6ea; }
.hvtype { font-size: 13px; color: #8a6a4a; font-family: "Malgun Gothic", sans-serif; }
.newcard.star { border-color: #e8a900; }
.newcard.unlock { border-color: #5fb8ff; background: #eef7ff; }
.newcard.special { border-color: #b07bff; background: #f6efff; }
/* 버섯 상점 */
.shop { width: 1760px; }
.shop .sub b { color: #3a8a2a; }
.res-mini .debt { color: #d23a2a; font-size: 18px; }
.shoplist { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; max-height: 640px; overflow-y: auto; padding: 4px; }
.shoprow { display: grid; grid-template-columns: 52px 150px 104px minmax(0, 1fr) 92px; gap: 8px; align-items: center; background: #fffaf0; border: 2px solid #e2cfa8; border-radius: 14px; padding: 6px 10px; }
.shoprow > img { width: 52px; height: 52px; }
.sh-name { display: flex; flex-direction: column; gap: 2px; }
.sh-name b { font-weight: normal; font-size: 20px; }
.sh-name .stars { position: static; font-size: 13px; }
.sh-have { font-size: 16px; line-height: 1.2; }
.sh-have b { font-weight: normal; font-size: 20px; }
.sh-have small { font-family: "Malgun Gothic", sans-serif; font-size: 12px; color: #8a6a4a; }
.sh-qty { display: flex; flex-direction: column; gap: 4px; }
.sh-btns { display: flex; gap: 4px; align-items: center; }
.sh-btns button.small { font-size: 14px; padding: 2px 7px; box-shadow: 0 2px 0 var(--wood-d); border-width: 2px; }
.sh-btns input[type=number] { width: 84px; font-family: inherit; font-size: 18px; text-align: center; border: 2px solid #cdb68e; border-radius: 8px; padding: 2px; }
.sh-btns input[type=range] { flex: 1; min-width: 60px; accent-color: #e8a900; }
.sh-sell { font-size: 18px; padding: 4px 8px; line-height: 1.1; }
.sh-sell small { font-size: 14px; }
.shop-empty { grid-column: 1 / -1; text-align: center; color: #9a8a70; font-size: 24px; padding: 40px; }
.shop-foot { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-top: 12px; font-size: 20px; }
.shop-foot b { font-weight: normal; color: #c99a00; }
.settle-btns { display: flex; gap: 14px; justify-content: center; margin-top: 16px; }
.srow button { font-size: 18px; padding: 4px 14px; }
/* 균사 트리 툴팁 부가 설명 */

<script>
'use strict';
// ===== 기본 상수 (명세 1장: 1920×1080 논리 좌표) =====
const W = 1920, H = 1080;                             // 화면(HUD) 좌표
// 필드(월드) 좌표: 필드 넓히기 노드에 따라 크기가 바뀐다. 필드가 작으면 화면에 확대(ZOOM)해서 그린다.
//   ZOOM 1.5 → 필드 1280×720 (수확기·버섯이 1.5배 크게 보임) … ZOOM 1 → 1920×1080 (원래 크기)
let ZOOM = 1, WW = W, WH = H;
let FX0 = 40, FX1 = 1880, FY0 = 40, FY1 = 1040;     // 벽 안쪽
const BAR_T = 14;
let BAR_Y = 1000;
const LAUNCH = { x: 960, y: 930 };
let NO_SPAWN_Y = 900;                               // 바 영역(이 아래로는 생성 금지)
const MAP_ZOOM = [1.5, 1.4, 1.3, 1.2, 1.1, 1.0];    // 필드 넓히기 레벨 0~5
function setWorld(z) {
  ZOOM = z; WW = Math.round(W / z); WH = Math.round(H / z);
  FX0 = 40; FX1 = WW - 40; FY0 = 40; FY1 = WH - 40;
  BAR_Y = WH - 80; NO_SPAWN_Y = WH - 180;
  LAUNCH.x = WW / 2; LAUNCH.y = WH - 150;
}
const TAU = Math.PI * 2;
const MAX_BALLS = 60;

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const chance = p => Math.random() < p;
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function pickWeighted(arr, wf) {
  let tot = 0;
  const ws = arr.map(a => { const w = Math.max(0, wf(a)); tot += w; return w; });
  if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}

// 큰 수 축약: 1.2K → 4.5M → 1.2B
function fmt(n) {
  if (!isFinite(n)) return '∞';
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
  let i = -1, v = n;
  while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + u[i];
}
function fmtN(v, d = 2) { return v >= 1000 ? fmt(v) : String(Math.round(v * 10 ** d) / 10 ** d); }
function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}시간 ${m}분` : m ? `${m}분 ${ss}초` : `${ss}초`;
}
function seeded(seed) {
  let s = (seed * 9301 + 49297) % 233280 || 1;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }

// ===== 효과음: 짧고 말랑한 "뽁·톡" (WebAudio 합성) =====
const Snd = {
  ctx: null, muted: false, vol: 0.2, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  tone(f, d = 0.08, type = 'sine', v = 1, slide = 0, key = null, gap = 0.035) {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    if (key) { if (this.last[key] && now - this.last[key] < gap) return; this.last[key] = now; }
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), now + d);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(this.vol * v, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g).connect(this.ctx.destination);
    o.start(now); o.stop(now + d + 0.03);
  },
  hit() { this.tone(rand(560, 680), 0.05, 'triangle', 0.45, 1.35, 'hit'); },
  harvest(combo) { this.tone(420 * Math.pow(2, Math.min(combo, 24) / 12), 0.09, 'sine', 0.75, 1.7, 'harv', 0.03); },

// ===== 라운드 능력치 계산 =====
function skillInfo(id) {

function computeStats(wId, themeId) {
  const st = { wId, weather: WEATHER[wId] || WEATHER.clear, theme: THEME[themeId] || THEMES[0], stage: stageNow() };
  const ab = st.ab = starAbilities();   // 버섯 별 능력 합계
  const core = id => lv(id) > 0;
  // 수확기: 활성화된 것들 중 핀볼마다 무작위 (makeBall). 별 수는 G.hv[id]
  st.hvs = activeHvs();
  st.hvStar = {}; for (const id of st.hvs) st.hvStar[id] = G.hv[id] || 1;
  st.atk = (NF.ps_atk(lv('ps_atk')) + (setDone('poison') ? 3 : 0)) * (core('core_ps') ? 1.1 : 1) * (1 + ab.atk);
  const spd = NF.ps_spd(lv('ps_spd')) * (1 + ab.spd) * (wId === 'storm' ? 0.8 : 1);
  st.spdMul = spd;
  st.launch = TUNE.launch * spd;
  st.minSpd = TUNE.min * spd;
  st.ballR = TUNE.ball0 * NF.ps_size(lv('ps_size')) * (1 + ab.size);
  st.barLen = (150 * NF.md_bar(lv('md_bar')) + (setDone('shelf') ? 40 : 0)) * (core('core_md') ? 1.1 : 1) * (1 + ab.bar) * (wId === 'cold' ? 0.75 : 1);
  st.duration = BASE_TIME * NF.ps_dur(lv('ps_dur')) + (G.specials.dew ? 2 : 0) + ab.dur - (wId === 'cold' ? 3 : 0);
  st.crit = NF.ps_crit(lv('ps_crit')) + (setDone('coral') ? 0.05 : 0) + ab.crit;
  st.comboK = NF.md_combo(lv('md_combo')) * (1 + ab.combo);
  st.scoreMul = NF.ed_score(lv('ed_score')) * (setDone('cook') ? 1.5 : 1) * (1 + ab.score);
  st.maxCol = Math.max(3, Math.ceil(colCount(lv('ed_cols')) * (wId === 'rain' ? 1.2 : 1) * (wId === 'drought' ? 0.7 : 1) * (1 + ab.cols)));
  st.regen = NF.ed_regen(lv('ed_regen')) / (wId === 'rain' ? 2 : 1) * (wId === 'storm' ? 2 : 1) / (1 + ab.regen);
  st.rareMul = NF.ed_rare(lv('ed_rare')) * (G.specials.star ? 1.25 : 1) * (1 + ab.rare);
  // 스테이지가 올라갈수록 높은 등급 가중치 증가: 등급마다 (1 + 0.03×(스테이지-1))^등급
  st.stageMul = 1 + 0.03 * (st.stage - 1);
  st.harvestMul = NF.ed_bonus(lv('ed_bonus')) * (1 + ab.harvest);
  st.multiP = multiRate(lv('ed_multi'));
  st.priceMul = priceMul();   // 수확 가치(세금 기준)·엽전 수확기 계산용
  st.fire = !!G.specials.fire;
  st.sparkP = G.specials.spark ? 0.06 : 0;
  st.colMax = 5 + lv('ed_size');
  st.zoom = MAP_ZOOM[lv('md_map')];
  const area = Math.pow(1 / (st.zoom * st.zoom), 0.7);   // 원래 필드 대비 넓이(^0.7: 좁은 필드에서도 너무 줄지 않게)
  st.maxCol = Math.max(4, Math.round(st.maxCol * area));
  st.golden = (NF.ed_gold(lv('ed_gold')) + (setDone('glow') ? 0.01 : 0)) * (wId === 'moon' ? 3 : 1) + ab.golden;
  st.devices = Math.max(1, Math.round((2 + lv('ed_dev')) * area));
  st.permBalls = 1 + lv('ps_ball');
  st.wanderP = wId === 'autumn' ? 0.3 : 0.08;
  st.wanderMul = (wId === 'autumn' ? 2 : 1.5) * (setDone('cordy') ? 1.5 : 1);
  st.poisonMul = setDone('amanita') ? 1.3 : 1;
  st.jellySlow = setDone('jelly') ? 0.75 : 0.55;
  st.skillDmg = (setDone('herb') ? 1.25 : 1) * (1 + ab.skillDmg);
  st.sporeP = 0.25 * (wId === 'wind' ? 2 : 1);
  st.debuffDur = 3 * (wId === 'wind' ? 2 : 1) * NF.ps_resist(lv('ps_resist'));
  // goldBonus: 점수 골드 보너스(황금 도감·무지개). 버섯 판매가는 priceMul()에서 따로 계산
  st.goldBonus = (1 + goldenSetBonus()) * (wId === 'rainbow' ? 1.5 : 1);
  st.harvestMul *= INCOME_MUL;
  st.goldMul = st.goldBonus * SCORE_GOLD;
  st.giantP = wId === 'rainbow' ? 1 : NF.ed_giant(lv('ed_giant'));
  st.specialP = SPECIAL_P + NF.ed_special(lv('ed_special'));
  st.specialLife = SPECIAL_LIFE + lv('ed_special');
  st.blade = lv('bl') > 0;
  st.bladeR = st.ballR + NF.bl_range(lv('bl_range'));
  st.bladeInt = NF.bl_spd(lv('bl_spd'));
  st.bladeDmg = st.atk * 0.4 * Math.pow(2, lv('bl_pow'));
  st.kidP = kidRate(lv('md_kid'));
  st.buffMul = NF.md_buffdur(lv('md_buffdur'));
  st.tempLife = NF.md_templife(lv('md_templife'));
  st.devMul = NF.md_stump(lv('md_stump'));
  st.heavyMul = NF.ps_heavy(lv('ps_heavy'));
  st.rushMul = NF.ps_rush(lv('ps_rush'));
  st.sk = {};
  for (const id of SKILL_IDS) { st.sk[id] = skillInfo(id); st.sk[id].p *= 1 + ab.skill; }
  st.burstR = 80 * Math.pow(1.2, st.sk.burst.P) + (setDone('fart') ? 30 : 0);

  st.dishes = (G.dishes || []).filter(id => RECIPE[id]);
  const k = NF.md_chef(lv('md_chef'));
  for (const id of st.dishes) RECIPE[id].apply(st, k);

      g.beginPath(); g.moveTo(x - r * 0.1, y - r * 0.05); g.lineTo(x, y + r * 0.06); g.lineTo(x + r * 0.1, y - r * 0.05); g.stroke();

    }
  }

      g.save(); g.clip(); g.fillStyle = c1; g.beginPath(); g.ellipse(0, -0.32 * r, 0.8 * r, 0.45 * r, 0, 0, TAU); g.fill();

      g.bezierCurveTo(-0.95 * r, -0.95 * r, 0.95 * r, -0.95 * r, 0.95 * r, -0.2 * r);

      g.beginPath(); for (const [x, y, rr] of bl) { g.moveTo(x * r + rr * r, y * r); g.arc(x * r, y * r, rr * r, 0, TAU); }

}

// mode: 0 일반 · 1 미해금 실루엣(어두움) · 2 해금했지만 미수확 실루엣(밝음)

  r = Math.round(r);
  const key = sp.id + '|' + r + '|' + (golden ? 1 : 0) + '|' + (mode || 0);
  let c = SPR[key];

  const s = Math.ceil(r * 2.7) + 4;
  c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');

    gr.addColorStop(0, 'rgba(255,240,150,0.75)'); gr.addColorStop(0.5, 'rgba(255,190,30,0.6)'); gr.addColorStop(1, 'rgba(200,130,10,0.7)');

// 군락의 거대한 버섯 무더기: 같은 종 버섯을 흙더미 위에 수북이 쌓은 그림

  c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');

  const key = 'u' + sp.id + '|' + r + '|' + (golden ? 1 : 0) + '|' + (mode || 0);
  return URLS[key] || (URLS[key] = shroomSprite(sp, r, golden, mode).toDataURL());
}

// ===== 재화 아이콘 =====
function iconURL(kind, size = 28) {

  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const r = size / 2;
  g.translate(r, r);
  const lw = Math.max(1.5, size * 0.07);
  if (kind === 'gold') {
    g.beginPath(); g.arc(0, 0, r * 0.85, 0, TAU); fillStroke(g, GOLD_C, lw);
    g.beginPath(); g.arc(0, 0, r * 0.55, 0, TAU); g.strokeStyle = '#c99a00'; g.lineWidth = lw * 0.8; g.stroke();
    g.fillStyle = '#fff6b0'; g.beginPath(); g.ellipse(-r * 0.3, -r * 0.35, r * 0.2, r * 0.12, -0.6, 0, TAU); g.fill();
  } else if (kind in CATS) {
    const col = CATS[kind].color;
    stemPath(g, r * 0.85, 0.25, 0.1, 0.9, '#f4ead8', lw);
    domeCap(g, r * 0.85, 0.95, -0.85, 0.15, col, lw, kind === 'ps' ? 'dots' : '', '#fff', { n: 'ic' });

    g.beginPath(); g.arc(r * 0.25, r * 0.45, r * 0.26, 0, TAU); g.fillStyle = '#e8452c'; g.fill();
  }
  return (URLS[key] = c.toDataURL());
}
function costHTML(cost, check = true) {
  return Object.keys(cost).map(k => {
    const ok = !check || resAmount(k) + 1e-9 >= cost[k];
    return `<span class="cost ${ok ? '' : 'lack'}"><img src="${iconURL(k, 22)}">${fmt(cost[k])}</span>`;

// ===== 수확기(핀볼) 그림 =====
// lvl: 수확기 레벨. 5(최대)면 날이 하나 늘고 금빛 테두리
function drawHarvester(ctx, type, r, ang, alpha = 1, lvl = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.rotate(ang);
  const lw = Math.max(1.5, r * 0.14);
  const maxed = lvl >= 5;
  ctx.lineJoin = 'round';
  if (maxed) {
    const g = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.35);
    g.addColorStop(0, 'rgba(255,215,80,0.45)'); g.addColorStop(1, 'rgba(255,215,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 1.35, 0, TAU); ctx.fill();
  }
  const edge = maxed ? '#ffd23a' : '#e8eef4';
  if (type === 'sam' || type === 'gold') {
    // 낫: 나무 막대 + 초승달 날 (최대 레벨이면 양쪽 끝에 날)
    const gold = type === 'gold';
    const blade = gold ? '#ffcf3a' : '#9aa6b2', wood = gold ? '#c99a1a' : '#9a6a3a';
    roundRect(ctx, -r * 0.95, -r * 0.16, r * 1.9, r * 0.32, r * 0.14);
    ctx.fillStyle = wood; ctx.fill(); ctx.lineWidth = lw * 0.8; ctx.strokeStyle = OL; ctx.stroke();
    ctx.strokeStyle = 'rgba(60,30,10,0.45)'; ctx.lineWidth = Math.max(1, r * 0.05);
    for (const x of [-0.5, -0.1, 0.3]) { ctx.beginPath(); ctx.moveTo(x * r, -r * 0.1); ctx.lineTo((x + 0.12) * r, r * 0.1); ctx.stroke(); }
    const sickle = () => {
      ctx.beginPath(); ctx.moveTo(r * 0.7, -r * 0.12);
      ctx.bezierCurveTo(r * 0.9, -r * 1.05, r * -0.1, -r * 1.25, -r * 0.45, -r * 0.75);
      ctx.bezierCurveTo(-r * 0.05, -r * 0.95, r * 0.55, -r * 0.8, r * 0.48, -r * 0.12);
      ctx.closePath(); ctx.fillStyle = blade; ctx.fill(); ctx.lineWidth = lw * 0.8; ctx.strokeStyle = OL; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * 0.4, -r * 0.8); ctx.bezierCurveTo(r * -0.05, -r * 1.12, r * 0.75, -r * 1.0, r * 0.66, -r * 0.3);

  } else if (type === 'saw') {

    const n = maxed ? 5 : 4;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, a2 = a + Math.PI / n;
      // 날 끝 → 넓게 부푼 날개 → 날 사이 골
      ctx.lineTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1);
      ctx.quadraticCurveTo(Math.cos(a + 0.5) * r * 0.95, Math.sin(a + 0.5) * r * 0.95, Math.cos(a2) * r * 0.5, Math.sin(a2) * r * 0.5);
    }
    ctx.closePath(); ctx.fillStyle = '#7d8a99'; ctx.fill(); ctx.lineWidth = lw * 0.8; ctx.strokeStyle = OL; ctx.stroke();
    ctx.strokeStyle = edge; ctx.lineWidth = Math.max(1, r * 0.07);
    for (let i = 0; i < n; i++) { const a = i / n * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3); ctx.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, TAU); ctx.fillStyle = '#2a3440'; ctx.fill(); ctx.lineWidth = lw * 0.6; ctx.strokeStyle = OL; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.1, 0, TAU); ctx.fillStyle = '#e8e2d0'; ctx.fill();
  } else if (type === 'bell') {
    ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 0.85, r * 0.9, 0, 0, TAU); ctx.fillStyle = '#c98a45'; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.95, r * 0.55, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = '#7a4f2a'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, r * 0.1, r * 0.15, r * 0.3, 0.3, 0, TAU); ctx.fill();
  } else if (type === 'mill') {

      ctx.fillStyle = '#b8c2cc'; ctx.fill(); ctx.lineWidth = lw * 0.7; ctx.strokeStyle = OL; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.6, -r * 0.24); ctx.quadraticCurveTo(r * 1.0, -r * 0.3, r * 1.04, r * 0.12);

    ctx.beginPath(); ctx.arc(0, 0, r * 0.36, 0, TAU); ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = Math.max(1, r * 0.06); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.15, 0, TAU); ctx.fillStyle = '#f2e6c8'; ctx.fill(); ctx.lineWidth = lw * 0.5; ctx.strokeStyle = OL; ctx.stroke();

    const a = baseAng != null ? baseAng + (i - (n - 1) / 2) * 0.4 + rand(-0.15, 0.15) : rand(0, TAU);

}
function launch(ang) {
  const n = R.balls.length;
  R.balls.forEach((b, i) => {
    const off = n > 1 ? (-8 + 16 * i / (n - 1)) * Math.PI / 180 : 0;
    b.dx = Math.cos(ang + off); b.dy = Math.sin(ang + off); fixDir(b);
    b.spd = R.st.launch;
  });
  R.phase = 'run';
  Snd.launch();
}
const wk = b => (b && b.weak > 0 ? 0.5 : 1);
function effMul(b) {
  let m = b.jf;
  if (b.accel > 0) m *= b.accelMul;
  if (b.moss > 0) m *= 1 + 0.4 * R.st.devMul;
  if (b.slow > 0) m *= 0.65;
  return m;
}

function updateBall(b, h) {
  const st = R.st;
  b.accel -= h; b.moss -= h; b.slow -= h; b.weak -= h; b.clear -= h; b.magnet -= h; b.mole -= h; b.stumpT -= h; b.bladeFx -= h;
  if (!b.perm) { b.life -= h; if (b.life <= 0) { b.dead = true; for (let i = 0; i < 6; i++) addPart(b.x, b.y, rand(-60, 60), rand(-60, 60), 0.4, '#dfe8f0', 3); return; } }
  b.spd = Math.max(st.minSpd, b.spd - b.spd * 0.18 * h);
  const v = b.spd * effMul(b);
  const steps = Math.min(80, Math.max(1, Math.ceil(v * h / (b.r * 0.45))));
  const sh = h / steps;
  for (let i = 0; i < steps; i++) stepBall(b, sh);
  // 포자 구름
  for (const c of R.clouds) {
    if (d2(b.x, b.y, c.x, c.y) < (c.r + b.r) ** 2 && b.clear <= 0) {
      if (c.slow) b.slow = st.debuffDur;
      if (c.weak) b.weak = st.debuffDur;
    }
  }
  // 회전 칼날 (강화 트리의 회전 칼날, 또는 회전칼날 수확기의 고유 칼날)
  const mill = b.hv === 'mill' ? HV.mill.ab(b.hs) : null;
  if (st.blade || mill) {
    b.bladeT -= h;
    if (b.bladeT <= 0) {
      b.bladeT += st.blade ? st.bladeInt : 0.35;
      const rr = bladeRadius(b);
      const dmg = (st.blade ? st.bladeDmg : st.atk * 0.4) * wk(b);
      let any = false;
      for (const m of queryCircle(b.x, b.y, rr + 30)) {
        if (d2(b.x, b.y, m.x, m.y) < (rr + m.r * 0.6) ** 2) {
          damage(m, dmg, b, 'blade', 0.5); any = true;
          if (mill && chance(mill.p)) millChip(m);   // 갈아내기: 버섯 조각 추가 수확
        }
      }
      if (any) b.bladeFx = 0.12;
    }
  }
  b.ang += (v / b.r) * h * 0.35;
  b.trail.push(b.x, b.y); if (b.trail.length > 16) b.trail.splice(0, 2);
}

function stepBall(b, h) {
  const st = R.st;
  if (b.magnet > 0) {
    let best = null, bd = 1e12;
    for (const m of queryCircle(b.x, b.y, 500)) { if (m.jelly) continue; const dd = d2(b.x, b.y, m.x, m.y); if (dd < bd) { bd = dd; best = m; } }
    if (best) {
      const cur = Math.atan2(b.dy, b.dx), want = Math.atan2(best.y - b.y, best.x - b.x);
      const maxd = b.magRate * h * Math.PI / 180;
      const a = cur + clamp(angDiff(cur, want), -maxd, maxd);
      b.dx = Math.cos(a); b.dy = Math.sin(a);
    }
  }
  const v = b.spd * effMul(b);
  const py = b.y;
  b.x += b.dx * v * h; b.y += b.dy * v * h;
  // 개울
  for (const d of R.devices) if (d.type === 'stream' && b.x > d.x0 && b.x < d.x1 && b.y > d.y0 && b.y < d.y1) { b.x += d.fx * 250 * h; b.y += d.fy * 250 * h; }
  // 벽
  if (b.x - b.r < FX0) { b.x = FX0 + b.r; b.dx = Math.abs(b.dx); fixDir(b); wallHit(b, 'l'); }
  else if (b.x + b.r > FX1) { b.x = FX1 - b.r; b.dx = -Math.abs(b.dx); fixDir(b); wallHit(b, 'r'); }
  if (b.y - b.r < FY0) { b.y = FY0 + b.r; b.dy = Math.abs(b.dy); fixDir(b); wallHit(b, 't'); }
  else if (b.y + b.r > FY1) { b.y = FY1 - b.r; b.dy = -Math.abs(b.dy); fixDir(b); b.combo = 0; wallHit(b, 'b'); }
  // 슬라이드 바 (위에서 내려오는 핀볼만)
  const top = BAR_Y - BAR_T / 2;
  if (b.dy > 0 && b.y + b.r >= top && py + b.r <= top + 2 && Math.abs(b.x - R.bar.x) <= R.bar.len / 2 + b.r * 0.6) barHit(b);
  // 버섯
  let inJ = false, jl = null;
  const inside = [];
  for (const m of queryCircle(b.x, b.y, b.r + 2)) {
    if (m.grow < 0.5) continue;
    const dx = b.x - m.x, dy = b.y - m.y, rr = b.r + m.r, dd = dx * dx + dy * dy;
    if (dd >= rr * rr) continue;
    if (m.jelly) { inJ = true; (jl || (jl = [])).push(m); continue; }
    // 이미 뚫고 지나가는 중
    if (b.inside.includes(m)) { inside.push(m); continue; }
    // 개별 버섯: 튕기지 않고 관통하며 피해
    if (!m.solid) { inside.push(m); directHit(m, b, 1); continue; }
    // 단단한 버섯(무더기·거대): 관통 스킬이 터지면 뚫고 지나감
    const pk = st.sk.pierce;
    if (pk.on && chance(pk.p)) { inside.push(m); directHit(m, b, pk.pm); skillFx('pierce', b.x, b.y); continue; }
    const d = Math.sqrt(dd) || 0.01, nx = dx / d, ny = dy / d;
    const dot = b.dx * nx + b.dy * ny;
    if (dot < 0) { b.dx -= 2 * dot * nx; b.dy -= 2 * dot * ny; fixDir(b); }
    b.x = m.x + nx * (rr + 0.5); b.y = m.y + ny * (rr + 0.5);
    if (b.lastHit === m && R.t - b.lastHitT < 0.04) continue;
    b.lastHit = m; b.lastHitT = R.t;
    directHit(m, b);
  }
  b.inside = inside;
  if (inJ) {
    if (!b.inJelly) { b.inJelly = true; b.jTick = 0.15; }
    b.jf = st.jellySlow;
    b.jTick += h;
    if (b.jTick >= 0.15) {
      b.jTick -= 0.15;
      for (const m of jl) damage(m, st.atk * 0.5 * wk(b), b, 'jelly', 0.5);
    }
  } else {
    b.inJelly = false;
    if (b.jf < 1) b.jf = Math.min(1, b.jf + (1 - st.jellySlow) * h);
  }
  // 특수 버섯 (튕기면서 맞는다)
  const sm = R.special;
  if (sm && sm.appear >= 0.5) {
    const dx = b.x - sm.x, dy = b.y - sm.y, rr = b.r + sm.r, dd = dx * dx + dy * dy;
    if (dd < rr * rr) {
      const d = Math.sqrt(dd) || 0.01, nx = dx / d, ny = dy / d, dot = b.dx * nx + b.dy * ny;
      if (dot < 0) { b.dx -= 2 * dot * nx; b.dy -= 2 * dot * ny; fixDir(b); }
      b.x = sm.x + nx * (rr + 0.5); b.y = sm.y + ny * (rr + 0.5);
      if (sm.hitCd <= 0) { sm.hitCd = 0.05; hitSpecial(sm, st.atk * wk(b) * (st.fire ? 1.3 : 1) * (b.sharpen > 0 ? b.sharpMul : 1), b); }
    }
  }
  // 숲 장치
  for (const d of R.devices) {
    if (d.type === 'stump') {
      const dx = b.x - d.x, dy = b.y - d.y, rr = b.r + d.r, dd = dx * dx + dy * dy;
      if (dd < rr * rr) {
        const dl = Math.sqrt(dd) || 0.01, nx = dx / dl, ny = dy / dl, dot = b.dx * nx + b.dy * ny;
        if (dot < 0) { b.dx -= 2 * dot * nx; b.dy -= 2 * dot * ny; fixDir(b); }
        b.x = d.x + nx * (rr + 0.5); b.y = d.y + ny * (rr + 0.5);
        b.spd = st.launch * 1.5;
        if (b.stumpT <= 0) {
          b.stumpT = 0.05; d.hitT = 0.2;
          const sc = TIERS[0].score * scoreMulFor(null, b) * 5 * st.devMul;
          addScore(sc, d.x, d.y - d.r, 0, false, false);
          Snd.bumper();
        }
      }
    } else if (d.type === 'moss') {
      if (b.x > d.x0 && b.x < d.x1 && b.y > d.y0 && b.y < d.y1) b.moss = 2;
    } else if (d.type === 'mole') {
      if (b.mole <= 0) {
        for (const [p, q] of [[d.a, d.b], [d.b, d.a]]) {
          if (d2(b.x, b.y, p.x, p.y) < 30 * 30) {
            b.x = q.x + b.dx * (30 + b.r + 4); b.y = q.y + b.dy * (30 + b.r + 4); b.mole = 1; b.trail.length = 0;
            for (let i = 0; i < 8; i++) addPart(q.x, q.y, rand(-80, 80), rand(-80, 80), 0.4, '#8a6a4a', 4);
            Snd.tone(200, 0.12, 'sine', 0.4, 2.5, 'mole');
            break;
          }
        }
      }
    } else if (d.type === 'acorn') {
      d.pts.forEach((p, i) => {
        if (!d.lit[i] && d2(b.x, b.y, p.x, p.y) < (18 + b.r) ** 2) {
          d.lit[i] = 1; Snd.tone(700 + i * 150, 0.08, 'triangle', 0.4);
          if (d.lit.every(x => x) && d.offT <= 0) {
            R.acornT = 5 * R.st.devMul; d.offT = 1;
            addLabel('도토리 점등! 점수 ×2', (d.pts[0].x + d.pts[2].x) / 2, d.pts[1].y - 40, '#ffe070', 30);
          }
        }
      });
    }
  }
}

function wallHit(b, side) {
  // 무손실 반사만으로는 같은 궤도를 반복하므로 ±4° 흔들어 준다
  const a = Math.atan2(b.dy, b.dx) + rand(-0.07, 0.07);
  b.dx = Math.cos(a); b.dy = Math.sin(a); fixDir(b);
  Snd.wall();
  const sk = R.st.sk.tornado;
  if (sk.on && chance(sk.p)) spawnTornado(b, side);
}

function barHit(b) {
  const st = R.st, bar = R.bar;
  const t = clamp((b.x - bar.x) / (bar.len / 2), -1, 1), a = t * 65 * Math.PI / 180;
  b.dx = Math.sin(a); b.dy = -Math.cos(a);
  b.y = BAR_Y - BAR_T / 2 - b.r;
  b.spd = Math.max(b.spd, st.launch);
  b.combo++;

  bar.fx = 0.15;
  Snd.bar();
  for (let i = 0; i < 5; i++) addPart(b.x, BAR_Y - 8, rand(-120, 120), rand(-200, -60), 0.35, '#ffe9a8', 3);
  if (!b.perm) return;   // 임시 핀볼은 바 버프를 받지 않음
  const sk = st.sk;
  const proc = id => sk[id].on && chance(sk[id].p);
  if (proc('accel')) { b.accel = 3 * st.buffMul; b.accelMul = 1 + 0.15 * sk.accel.pm; skillFx('accel', b.x, b.y); }
  if (proc('sharpen')) { b.sharpen = Math.ceil(3 * st.buffMul); b.sharpMul = 2 * sk.sharpen.pm; skillFx('sharpen', b.x, b.y); }
  if (proc('split')) { spawnTemp(b.x, b.y - 4, 1 + sk.split.P, 6, false, Math.atan2(b.dy, b.dx)); skillFx('split', b.x, b.y); }
  if (proc('sip')) { addTime(0.3 * sk.sip.pm, 'sip', b.x, b.y); skillFx('sip', b.x, b.y); }
  if (proc('clear')) { b.clear = 1.5 * sk.clear.pm * st.buffMul; b.slow = 0; b.weak = 0; skillFx('clear', b.x, b.y); }
  if (st.kidP && chance(st.kidP)) { spawnTemp(b.x, b.y - 4, 1, 8, true, -Math.PI / 2 + rand(-0.7, 0.7)); skillFx('md_kid', b.x, b.y); }
}

function skillFx(id, x, y) {
  R.skillFlash[id] = 0.6;
  if ((R.skillLabelT[id] || 0) > R.t) return;   // 같은 스킬 이름은 1.5초에 한 번만 띄움
  R.skillLabelT[id] = R.t + 1.5;
  const s = SKILLS[id] || NODE[id] || ({ spark: { n: '찌릿 번개', col: '#ffe03a' }, hv_split: { n: '세포 분열', col: '#ff8a80' } })[id];

// ===== 피해·점수·수확 =====
function scoreMulFor(m, b) {
  const st = R.st;
  let x = st.scoreMul * (1 + (b ? b.combo : 0) * st.comboK);
  if (m) {
    if (m.golden) x *= 10;
    if (m.col && m.col.wander) x *= st.wanderMul;
    if (m.giant) x *= 3;
  }
  if (R.acornT > 0) x *= 2;
  if (R.festOn) x *= st.festMul;

}
function damage(m, amt, b, kind, scoreF = 1, wave = null, forceCrit = false) {

  m.hp -= amt * (crit ? 3 : 1);
  m.squish = 1;
  const sc = TIERS[m.sp.t].score * scoreMulFor(m, b) * (crit ? 3 : 1) * scoreF;

}
function directHit(m, b, mul = 1) {

  if (hv === 'coin') {

}
// 회전 칼날 반지름: 강화 트리 칼날과 회전칼날 수확기 고유 칼날 중 큰 쪽 (임시 핀볼은 크기에 비례)

// 회전칼날 수확기 '갈아내기': 버섯 1개분 수확량을 창고에 추가 (버섯은 그대로)

// 낫 수확기 '휘두르기': 가까운 버섯 하나를 함께 벤다
