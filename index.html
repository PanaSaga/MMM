  const col = CATS[sp.c].color;
  const np = m.giant ? 60 : m.cluster ? 28 : 8 + sp.t * 4;
  for (let i = 0; i < np; i++) {
    const a = rand(0, TAU), s = rand(60, m.giant ? 600 : 260);
    addPart(m.x, m.y, Math.cos(a) * s, Math.sin(a) * s - 60, rand(0.3, 0.7), i % 3 ? col : m.golden ? '#ffd23a' : sp.c1, m.giant ? 7 : 4);
  }
  // 버섯이 톡 튀어 카운터로 날아감 (무더기는 와르르)
  const nf = m.giant ? 30 : m.cluster ? 6 + m.dropMul : 1;
  for (let i = 0; i < nf && R.flyers.length < 220; i++) {
    const a = rand(0, TAU), s0 = m.cluster || m.giant ? rand(10, m.r) : 0;
    R.flyers.push({ x: m.x, y: m.y, sx: m.x + Math.cos(a) * s0, sy: m.y + Math.sin(a) * s0, t: -i * 0.025, dur: rand(0.45, 0.7), sp, golden: m.golden, cat: sp.c });
  }
  if (m.cluster) {
    addLabel(`+${fmt(drop)} ${CATS[sp.c].name}`, m.x, m.y - m.r - 10, CATS[sp.c].light, 30);
    if (R.balls.length < 8) R.shake = Math.max(R.shake, 0.15);
    R.rings.push({ x: m.x, y: m.y, r: m.r * 2.2, t: 0, dur: 0.35, col: CATS[sp.c].color });
    Snd.tone(300, 0.18, 'sine', 0.7, 2.2, 'heap', 0.05);
  }
  if (m.giant) { R.hitstop = 0.3; R.hitstopCd = 0.8; R.flash = 0.8; R.shake = 1; Snd.rare(); R.giant = null; addLabel('거대 버섯 수확!', m.x, m.y - 120, '#fff', 44); }
  else if (sp.t >= 2) { if (R.hitstopCd <= 0) { R.hitstop = Math.max(R.hitstop, sp.t === 3 ? 0.12 : 0.06); R.hitstopCd = 0.6; } if (R.flashCd <= 0) { R.flash = Math.max(R.flash, sp.t === 3 ? 0.25 : 0.1); R.flashCd = 1.2; } Snd.rare(); }
  else Snd.harvest(b ? b.combo : 0);
  // 군락지
  if (m.col) {
    m.col.alive--;
    if (m.col.alive <= 0) { const i = R.colonies.indexOf(m.col); if (i >= 0) R.colonies.splice(i, 1); R.regen.push({ t: st.regen }); }
  }
  // 수확기 고유 능력 (수확 시)
  if (b && b.hv === 'sam' && kind !== 'skill' && chance(HV.sam.ab(b.hs).p)) R.queue.push({ t: 0.05, f: () => samCleave(m, b) });
  // 수확 시 스킬
  const sk = st.sk;
  if (kind === 'shock') {
    if (wave && !wave.child && wave.depth < 8) { wave.child = true; const x = m.x, y = m.y, dp = wave.depth + 1, wb = wave.b; R.queue.push({ t: 0.08, f: () => makeWave(x, y, dp, wb) }); }
  } else if (sk.shock.on && chance(sk.shock.p)) { makeWave(m.x, m.y, 1, b); skillFx('shock', m.x, m.y); }
  if (sk.clone.on && chance(sk.clone.p)) { spawnTemp(m.x, m.y, 1 + sk.clone.P, 4, true, null); skillFx('clone', m.x, m.y); }
  if (sk.device.on && R.deviceSpawned < 10 && chance(sk.device.p)) {
    const d = placeDevice(pick(DEVICE_TYPES), { x: m.x, y: m.y });
    if (d) { R.deviceSpawned++; skillFx('device', m.x, m.y); }
  }
}

function addScore(v, x, y, tier, crit, golden) {
  R.score += v; R.scoreBump = 1;
  // 화면이 숫자로 덮이지 않게: 일반은 25개, 높은 등급·치명·황금도 45개까지만
  if (R.texts.length > 25 && tier < 2 && !golden) return;
  if (R.texts.length > 45) return;
  R.texts.push({ x: x + rand(-8, 8), y, v, t: 0, tier, crit, golden });
}
function addPart(x, y, vx, vy, life, col, size) {
  if (R.parts.length > 260) return;
  R.parts.push({ x, y, vx, vy, t: 0, life, col, size });
}
function addLabel(text, x, y, col, size) {
  if (R.labels.length > 10) R.labels.shift();
  R.labels.push({ text, x: clamp(x, 120, WW - 120), y: clamp(y, 80, WH - 60), col, size, t: 0 });
}
function addTime(amount, kind, x, y) {
  const cap = kind === 'tspore' ? 15 : 10;
  const used = kind === 'tspore' ? R.tsporeUsed : R.sipUsed;
  const a = Math.min(amount, cap - used);
  if (a <= 0) return;
  if (kind === 'tspore') R.tsporeUsed += a; else R.sipUsed += a;
  R.timeLeft += a; R.timeMax = Math.max(R.timeMax, R.timeLeft);
  if (R.flyers.length < 90) R.flyers.push({ x, y, sx: x, sy: y, t: 0, dur: 0.6, clock: true, tx: 960 / ZOOM, ty: 32 / ZOOM });
  addLabel(`+${fmtN(a, 1)}초`, x, y - 20, '#9ee6ff', 20);
}

// ===== 스킬 효과 =====
function spawnCloud(x, y, type) {
  R.clouds.push({ x, y, r: 120, t: 4, max: 4, slow: type === 'slow' || type === 'both', weak: type === 'weak' || type === 'both' });
  Snd.tone(140, 0.3, 'sine', 0.3, 0.6, 'puff', 0.1);
}
function burstAt(x, y, rad, dmg, b, col, quiet) {
  R.rings.push({ x, y, r: rad, t: 0, dur: quiet ? 0.2 : 0.35, col, quiet });
  for (const m of queryCircle(x, y, rad + 30)) if (d2(x, y, m.x, m.y) < (rad + m.r * 0.5) ** 2) damage(m, dmg, b, 'skill');
}
function chainBolt(m0, b) {
  const st = R.st, P = st.sk.bolt.P, n = 2 + P, dmg = st.atk * Math.pow(2, P) * st.skillDmg * wk(b);
  const hit = new Set([m0]), pts = [{ x: m0.x, y: m0.y }];
  let cur = m0;
  for (let i = 0; i < n; i++) {
    let best = null, bd = 280 * 280;
    for (const m of queryCircle(cur.x, cur.y, 280)) { if (hit.has(m)) continue; const dd = d2(cur.x, cur.y, m.x, m.y); if (dd < bd) { bd = dd; best = m; } }
    if (!best) break;
    hit.add(best); pts.push({ x: best.x, y: best.y });
    const tx = best.x, ty = best.y;
    damage(best, dmg, b, 'skill');
    cur = { x: tx, y: ty };
  }
  R.bolts.push({ pts, t: 0.3 });
  Snd.skill(900);
}
function spawnTornado(b, side) {
  if (R.tornados.length >= 4) return;
  const st = R.st, P = st.sk.tornado.P, hh = 50 * Math.pow(1.3, P);
  const dir = side === 'l' ? 1 : side === 'r' ? -1 : (b.x < 960 ? 1 : -1);
  R.tornados.push({ y: clamp(b.y, FY0 + hh / 2, NO_SPAWN_Y), h: hh, x: dir > 0 ? FX0 : FX1, dir, dmg: st.atk * 2 * Math.pow(2, P) * st.skillDmg * wk(b), hit: new Set(), b });
  skillFx('tornado', b.x, b.y); Snd.skill(420);
}
function makeWave(x, y, depth, b) {
  const st = R.st, P = st.sk.shock.P;
  R.waves.push({ x, y, r: 0, max: 100 * Math.pow(1.2, P), dmg: st.atk * Math.pow(2, P) * st.skillDmg * wk(b), depth, hit: new Set(), child: false, t: 0, b });
  if (depth > R.maxChain) R.maxChain = depth;
  if (depth > 1) addLabel(`연쇄 ${depth}`, x, y - 30, '#ffd0a0', 18 + depth);
  Snd.skill(260 + depth * 40);
}
// ===== 특수 버섯 (캐릭터 버섯) =====
function spawnSpecial() {
  const st = R.st;
  const pool = SPECIALS.filter(s => !G.specials[s.id]);
  const kind = pick(pool.length ? pool : SPECIALS);
  let p = null;
  for (let a = 0; a < 40 && !p; a++) {
    const x = rand(FX0 + 90, FX1 - 90), y = rand(FY0 + 90, NO_SPAWN_Y - 70);
    if (areaFree([{ k: 'c', x, y, r: 50 }])) p = { x, y };
  }
  if (!p) p = { x: rand(FX0 + 100, FX1 - 100), y: rand(FY0 + 100, NO_SPAWN_Y - 100) };
  const hp = st.atk * 2;   // 수확기로 직접 2번 맞히면 잡힌다 (스킬로는 안 맞음)
  const life = st.specialLife;
  R.special = { kind, x: p.x, y: p.y, r: 50, hp, maxHp: hp, t: life, max: life, hitCd: 0, squish: 0, vx: 0, vy: 0, hopT: 0.4, appear: 0 };
  addLabel(`${kind.n} 등장! ${life}초 안에 잡아요!`, p.x, p.y - 80, kind.c2, 34);
  R.shake = Math.max(R.shake, 0.3); Snd.rare();
  for (let i = 0; i < 20; i++) addPart(p.x, p.y, rand(-200, 200), rand(-260, -40), 0.6, i % 2 ? kind.c1 : '#fff', 5);
}
function hitSpecial(sm, amt, b) {
  sm.hp -= amt; sm.squish = 1;
  addScore(TIERS[2].score * scoreMulFor(null, b), sm.x, sm.y - sm.r, 2, false, false);
  for (let i = 0; i < 6; i++) addPart(sm.x, sm.y, rand(-150, 150), rand(-200, -40), 0.4, sm.kind.c1, 4);
  if (sm.hp <= 0) catchSpecial(sm);
}
function catchSpecial(sm) {
  R.special = null;
  const k = sm.kind;
  if (!G.specials[k.id]) {
    G.specials[k.id] = true; R.specialGot = k.id; saveGame();
    addLabel(`${k.n} 포획! 영구 능력 획득`, sm.x, sm.y - 70, '#fff7c2', 38);
    addLabel(k.perk.split(':')[0] + ' (다음 라운드부터)', sm.x, sm.y - 20, k.c2, 24);
  } else {
    // 이미 가진 특수 버섯이면 보너스 판매 금액 (이번 사이클 세금의 30%)
    const bonus = Math.ceil(taxBill() * 0.3);
    R.bonusGold += bonus;
    addLabel(`${k.n} 포획! 보너스 +${fmt(bonus)}골드`, sm.x, sm.y - 70, '#ffe36e', 34);
  }
  R.flash = Math.max(R.flash, 0.6); R.shake = Math.max(R.shake, 0.6);
  R.hitstop = Math.max(R.hitstop, 0.15); R.hitstopCd = 0.6;
  R.rings.push({ x: sm.x, y: sm.y, r: 160, t: 0, dur: 0.5, col: k.c1 });
  for (let i = 0; i < 50; i++) { const a = rand(0, TAU), s = rand(80, 500); addPart(sm.x, sm.y, Math.cos(a) * s, Math.sin(a) * s - 80, rand(0.4, 0.9), i % 3 ? k.c1 : k.c2, 6); }
  Snd.record();
}
function updateSpecial(h) {
  if (R.specialAt >= 0 && R.runT >= R.specialAt && !R.special) { R.specialAt = -1; spawnSpecial(); }
  const sm = R.special;
  if (!sm) return;
  sm.t -= h; sm.hitCd -= h; sm.appear = Math.min(1, sm.appear + h * 3); sm.squish = Math.max(0, sm.squish - h * 5);
  // 깡총깡총 뛰어다닌다
  sm.hopT -= h;
  if (sm.hopT <= 0) { sm.hopT = rand(0.6, 1.1); const a = rand(0, TAU); sm.vx = Math.cos(a) * 70; sm.vy = Math.sin(a) * 70; }
  sm.x += sm.vx * h; sm.y += sm.vy * h;
  if (sm.x < FX0 + sm.r || sm.x > FX1 - sm.r) { sm.vx = -sm.vx; sm.x = clamp(sm.x, FX0 + sm.r, FX1 - sm.r); }
  if (sm.y < FY0 + sm.r || sm.y > NO_SPAWN_Y - sm.r) { sm.vy = -sm.vy; sm.y = clamp(sm.y, FY0 + sm.r, NO_SPAWN_Y - sm.r); }
  if (sm.t <= 0) {
    R.special = null;
    addLabel(`${sm.kind.n}가 숲으로 도망쳤어요…`, sm.x, sm.y - 50, '#e8dcc4', 28);
    for (let i = 0; i < 16; i++) addPart(sm.x, sm.y, rand(-80, 80), rand(-120, -20), 0.6, 'rgba(230,230,220,0.9)', 8);
  }
}

function findGiantSpot() {
  for (let rad = 0; rad < 800; rad += 40) {
    const k = Math.max(1, Math.round(rad / 25));
    for (let i = 0; i < k; i++) {
      const a = i / k * TAU + rad, x = WW / 2 + Math.cos(a) * rad, y = NO_SPAWN_Y / 2 + Math.sin(a) * rad * 0.6;
      if (x - 90 < FX0 || x + 90 > FX1 || y - 90 < FY0 || y + 90 > NO_SPAWN_Y) continue;
      if (areaFree([{ k: 'c', x, y, r: 90 }])) return { x, y };
    }
  }
  return { x: WW / 2, y: NO_SPAWN_Y / 2 };
}

function updateEffects(h) {
  const st = R.st;
  R.runT += h;
  // 군락지 재생
  for (const t of R.regen) t.t -= h;
  for (let i = R.regen.length - 1; i >= 0; i--) {
    if (R.regen[i].t <= 0) { if (spawnColony(false)) R.regen.splice(i, 1); else R.regen[i].t = 0.5; }
  }
  const missing = st.maxCol - R.colonies.length - R.regen.length;
  for (let i = 0; i < missing; i++) R.regen.push({ t: st.regen });
  // 포자 구름
  for (const c of R.clouds) c.t -= h;
  R.clouds = R.clouds.filter(c => c.t > 0);
  // 충격파
  for (const w of R.waves) {
    w.t += h; w.r = w.max * Math.min(1, w.t / 0.22);
    for (const m of queryCircle(w.x, w.y, w.r + 30)) {
      if (w.hit.has(m)) continue;
      if (d2(w.x, w.y, m.x, m.y) < (w.r + m.r * 0.5) ** 2) { w.hit.add(m); damage(m, w.dmg, w.b, 'shock', 1, w); }
    }
  }
  R.waves = R.waves.filter(w => w.t < 0.4);
  // 회오리
  for (const tn of R.tornados) {
    tn.x += tn.dir * 2200 * h;
    for (const m of R.shrooms) {
      if (m.dead || tn.hit.has(m)) continue;
      if (Math.abs(m.y - tn.y) < tn.h / 2 + m.r && Math.abs(m.x - tn.x) < 40 + m.r) { tn.hit.add(m); damage(m, tn.dmg, tn.b, 'skill'); }
    }
  }
  R.tornados = R.tornados.filter(t => t.x > FX0 - 60 && t.x < FX1 + 60);
  // 지연 실행
  for (const q of R.queue) q.t -= h;
  const ready = R.queue.filter(q => q.t <= 0);
  R.queue = R.queue.filter(q => q.t > 0);
  ready.forEach(q => q.f());
  // 거대 버섯
  if (R.giantState === 'pending' && R.runT >= 4) {
    const p = findGiantSpot(); R.giantWarn = { x: p.x, y: p.y, t: 0 }; R.giantState = 'warn'; R.shake = 1;
    Snd.tone(60, 0.8, 'sawtooth', 0.4, 0.7);
  } else if (R.giantState === 'warn') {
    R.giantWarn.t += h; R.shake = Math.max(R.shake, 0.5);
    if (R.runT >= 5) {
      const sp = pickSpecies(false) || SPECIES[0], T = TIERS[sp.t];
      const g = { sp, x: R.giantWarn.x, y: R.giantWarn.y, r: 90, hp: T.hp * 40, maxHp: T.hp * 40, giant: true, col: null, golden: chance(st.golden),
        jelly: false, solid: true, spore: sp.spore || null, sporeCd: 0, squish: 0, dead: false, grow: 0.5, qs: 0 };
      R.giant = g; R.shrooms.push(g); R.giantWarn = null; R.giantState = 'up';
      addLabel(`거대 ${sp.n} 등장!`, g.x, g.y - 130, '#fff', 40);
      for (let i = 0; i < 40; i++) addPart(g.x + rand(-90, 90), g.y + rand(40, 90), rand(-150, 150), rand(-300, -80), 0.8, '#8a6a4a', 6);
    }
  }
  // 천둥번개 날씨
  if (st.wId === 'thunder') {
    R.lightningT -= h;
    if (R.lightningT <= 0) {
      R.lightningT = rand(2.5, 4.5);
      const alive = R.shrooms.filter(m => !m.dead);
      if (alive.length) {
        const m = pick(alive);
        R.bolts.push({ pts: [{ x: m.x + rand(-80, 80), y: 0 }, { x: m.x + rand(-30, 30), y: m.y * 0.5 }, { x: m.x, y: m.y }], t: 0.35, big: true });
        R.flash = Math.max(R.flash, 0.3);
        burstAt(m.x, m.y, 70, st.atk * 2 * st.skillDmg, null, '#fff36b', true);
        Snd.skill(80);
      }
    }
  }
  // 도토리
  if (R.acornT > 0) R.acornT -= h;
  for (const d of R.devices) if (d.type === 'acorn' && d.offT > 0) { d.offT -= h; if (d.offT <= 0) d.lit = [0, 0, 0]; }
  for (const d of R.devices) if (d.hitT > 0) d.hitT -= h;
}

function updateFx(h) {
  for (const p of R.parts) { p.t += h; p.x += p.vx * h; p.y += p.vy * h; p.vy += 500 * h; p.vx *= 0.97; }
  R.parts = R.parts.filter(p => p.t < p.life);
  for (const t of R.texts) { t.t += h; t.y -= 50 * h; }
  R.texts = R.texts.filter(t => t.t < (t.tier >= 2 ? 1.2 : 0.8));
  for (const l of R.labels) { l.t += h; l.y -= 25 * h; }
  R.labels = R.labels.filter(l => l.t < 1.4);
  for (const r of R.rings) r.t += h;
  R.rings = R.rings.filter(r => r.t < r.dur);
  for (const b of R.bolts) b.t -= h;
  R.bolts = R.bolts.filter(b => b.t > 0);
  for (const f of R.flyers) {
    f.t += h;
    if (f.t < 0) continue;
    if (!f.clock) { const s = HUD_SLOTS[f.cat]; f.tx = s.x / ZOOM; f.ty = s.y / ZOOM; }
    const k = Math.min(1, f.t / f.dur), e = k * k * (3 - 2 * k);
    f.x = lerp(f.sx, f.tx, e) + Math.sin(k * Math.PI) * -60 * (f.sx > f.tx ? -1 : 1) * 0.3;
    f.y = lerp(f.sy, f.ty, e) - Math.sin(k * Math.PI) * 120;
    if (k >= 1) { f.done = true; if (!f.clock) R.slotBump[f.cat] = 1; }
  }
  R.flyers = R.flyers.filter(f => !f.done);
  for (const k in R.skillFlash) R.skillFlash[k] -= h;
  if (R.comboShow.t > 0) R.comboShow.t -= h;
  R.scoreBump = Math.max(0, R.scoreBump - h * 5);
  R.saleBump = Math.max(0, R.saleBump - h * 5);
  for (const c of CAT_KEYS) R.slotBump[c] = Math.max(0, R.slotBump[c] - h * 5);
  R.codexShake = Math.max(0, R.codexShake - h * 1.5);
  R.flashCd -= h;
  updateCombo(h);
  R.shake = Math.max(0, R.shake - h * 2.5);
  R.hitstopCd -= h;
  R.flash = Math.max(0, R.flash - h * 2);
  R.bar.fx = Math.max(0, R.bar.fx - h);
}

function checkRecords() {
  if (G.rounds === 0) return;
  const cur = { score: R.score, combo: R.maxCombo, harvest: R.harvests, balls: R.maxBalls, chain: R.maxChain };
  for (const k in cur) {
    if (!R.newRec[k] && G.rec[k] > 0 && cur[k] > G.rec[k]) {
      R.newRec[k] = true;
      addLabel('신기록! ' + RECORD_NAMES[k], WW / 2, WH * 0.28, '#ffef7a', 40);
      Snd.record();
    }
  }
}

// 한 프레임 진행 (h: 게임 시간)
function simFrame(h) {
  R.t += h;
  const st = R.st;
  if (R.phase === 'run') {
    if (!DBG.infinite) R.timeLeft -= h;
    R.festOn = st.sk.fest.on && R.timeLeft <= 5;
    if (R.timeLeft <= 0) { R.timeLeft = 0; R.phase = 'end'; R.endT = 1.5; R.festOn = false; Snd.record(); }
  }
  for (const m of R.shrooms) {
    if (m.grow < 1) m.grow = Math.min(1, m.grow + h / 0.35);
    if (m.sporeCd > 0) m.sporeCd -= h;
    if (m.squish > 0) m.squish = Math.max(0, m.squish - h * 5);
  }
  if (R.phase === 'run') {
    updateWander(h);
    rebuildGrid();
    for (const b of R.balls) updateBall(b, h);
    R.balls = R.balls.filter(b => !b.dead);
    if (R.balls.length > R.maxBalls) R.maxBalls = R.balls.length;
    updateEffects(h);
    updateSpecial(h);
    R.shrooms = R.shrooms.filter(m => !m.dead);
    checkRecords();
  } else if (R.phase === 'end') {
    R.endT -= h;
  }
  updateFx(h);
}

// ===== 콤보·피버 (연속 수확) =====
// 버섯을 수확한 뒤 COMBO_WINDOW초 안에 또 수확하면 콤보 +1, 시간이 지나면 끊긴다.
// 콤보가 클수록 화면 위 숫자가 커지고, FEVER_AT부터 맵 전체에 밝은 화염 이펙트(피버타임) + 점수 보너스.
// (핀볼이 바에 연속으로 맞는 '바 콤보'(b.combo, 콤보 계수 노드)는 따로 있고, 핀볼 위에 작게 x3처럼 표시된다)
const COMBO_WINDOW = 1.5;
const FEVER = [
  { at: 25, n: 'FEVER!', mul: 1.5 },
  { at: 70, n: 'SUPER FEVER!!', mul: 2 },
];
const feverLv = c => (c >= FEVER[1].at ? 2 : c >= FEVER[0].at ? 1 : 0);
// 불꽃 색: 콤보 FLAME_STEP마다 다음 색 (마지막 색에서 멈춤). core·mid·edge = 불꽃 안쪽→바깥 RGB, text·out = 콤보 숫자 색·테두리
const FLAME_STEP = 10000;
const FLAME = [
  { n: '노란 불꽃', icon: '🔥', core: '255,190,80', mid: '235,100,25', edge: '210,80,20', text: '#ffe36e', out: '#c2400a' },
  { n: '푸른 불꽃', icon: '🔵', core: '170,225,255', mid: '60,140,255', edge: '30,90,220', text: '#bfe6ff', out: '#1a4fb8' },
  { n: '보라 불꽃', icon: '🟣', core: '235,180,255', mid: '160,80,240', edge: '110,40,200', text: '#ead0ff', out: '#5a1a9a' },
  { n: '초록 불꽃', icon: '🟢', core: '200,255,180', mid: '70,210,90', edge: '30,150,60', text: '#d0ffc0', out: '#1a6a2a' },
  { n: '하얀 불꽃', icon: '⚪', core: '255,255,255', mid: '215,215,240', edge: '160,160,210', text: '#ffffff', out: '#4a4a6a' },
];
const flameIdx = c => Math.min(FLAME.length - 1, Math.floor(c / FLAME_STEP));
const flameIntensity = c => {
  const inTier = flameIdx(c) < FLAME.length - 1 ? c % FLAME_STEP : c - (FLAME.length - 1) * FLAME_STEP;
  return 0.5 + 0.75 * clamp(Math.log10(1 + inTier) / 4, 0, 1);   // 25콤보 ≈ 0.76 · 1천 ≈ 1.06 · 1만 직전 ≈ 1.25
};
const feverMul = () => (R.fever ? FEVER[R.fever - 1].mul : 1);
function comboHit() {
  R.chain = R.chainT > 0 ? R.chain + 1 : 1;
  R.chainT = COMBO_WINDOW; R.chainBump = 1;
  if (R.chain > R.maxCombo) R.maxCombo = R.chain;
  const fi = flameIdx(R.chain);
  R.flamePal = fi;   // 불꽃 색 단계 (콤보 1만마다 다음 색)
  // 콤보 1만 단위에 도달할 때마다 'SUPER COMBO!' (그 단계 불꽃 색으로)
  if (R.chain % FLAME_STEP === 0) {
    R.feverMsg = { text: 'SUPER COMBO!', sub: `${fmt(R.chain)} COMBO`, t: 0, lv: 2, pal: fi, noIcon: true };
    R.flash = Math.max(R.flash, 0.3);
    Snd.record(); Snd.tone(260 + fi * 60, 0.6, 'sawtooth', 0.3, 3);
  }
  const lv = feverLv(R.chain);
  if (lv > R.fever) {   // 피버 진입
    R.fever = lv; R.feverMsg = { text: FEVER[lv - 1].n, t: 0, lv };
    R.flash = Math.max(R.flash, 0.5); R.shake = Math.max(R.shake, 0.4);
    Snd.record(); Snd.tone(lv === 2 ? 220 : 180, 0.5, 'sawtooth', 0.35, 3);
  }
}
function updateCombo(h) {
  if (R.chainT > 0) { R.chainT -= h; if (R.chainT <= 0) { R.chain = 0; R.fever = 0; } }
  R.chainBump = Math.max(0, R.chainBump - h * 6);
  // 화염 세기는 부드럽게 따라감 (0 · 1 · 2)
  R.feverK += (R.fever - R.feverK) * Math.min(1, h * (R.fever > R.feverK ? 6 : 2.5));
  if (R.chain) R.flameInt += (flameIntensity(R.chain) - R.flameInt) * Math.min(1, h * 4);
  if (R.feverMsg) { R.feverMsg.t += h; if (R.feverMsg.t > 1.6) R.feverMsg = null; }
  // 불티 (화면 좌표)
  const k = R.feverK;
  if (k > 0.05) {
    const n = Math.random() < k * 0.45 ? 1 : 0;
    for (let i = 0; i < n && R.embers.length < 60; i++) {
      const side = Math.random(), sp = rand(160, 380) * (0.7 + k * 0.3);
      if (side < 0.4) R.embers.push({ x: rand(0, W), y: H + 5, vx: rand(-40, 40), vy: -sp, t: 0, life: rand(0.8, 1.6), s: rand(2, 5) });        // 아래 → 위
      else if (side < 0.6) R.embers.push({ x: rand(0, W), y: -5, vx: rand(-40, 40), vy: sp * 0.6, t: 0, life: rand(0.6, 1.2), s: rand(2, 4) });   // 위 → 아래
      else if (side < 0.8) R.embers.push({ x: -5, y: rand(0, H), vx: sp * 0.6, vy: rand(-60, 20), t: 0, life: rand(0.6, 1.2), s: rand(2, 4) });  // 왼쪽 → 안
      else R.embers.push({ x: W + 5, y: rand(0, H), vx: -sp * 0.6, vy: rand(-60, 20), t: 0, life: rand(0.6, 1.2), s: rand(2, 4) });              // 오른쪽 → 안
    }
  }
  for (const e of R.embers) { e.t += h; e.x += e.vx * h + Math.sin((e.t + e.s) * 6) * 30 * h; e.y += e.vy * h; }
  R.embers = R.embers.filter(e => e.t < e.life);
}
// 맵 전체 화염 이펙트 (화면 좌표, HUD 아래)
// 화면이 하얗게 뜨지 않도록 일반 합성 + 낮은 투명도. 상하좌우 가장자리에서 안쪽으로 불꽃이 솟는다.
// 색은 불꽃 단계(FLAME, 콤보 1만마다), 진하기는 그 단계 안에서 콤보가 쌓일수록 진해진다(flameIntensity).
function drawFever(ctx, now) {
  const k = R.feverK;
  if (k < 0.02 && !R.embers.length) return;
  const a1 = Math.min(1, k), a2 = Math.max(0, k - 1);
  const F = FLAME[R.flamePal] || FLAME[0];
  const I = R.flameInt;                 // 진하기 0.5~1.25: 콤보가 쌓일수록 진해진다
  ctx.save();
  const pulse = 0.85 + 0.15 * Math.sin(now * 8);
  // 가장자리 열기 (상하좌우)
  const edge = (x0, y0, x1, y1, a) => {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${F.edge},${a})`); g.addColorStop(1, `rgba(${F.edge},0)`);
    return g;
  };
  const ea = (0.13 + 0.06 * a2) * a1 * pulse * I, ed = 150 + 60 * a2 + 60 * I;
  ctx.fillStyle = edge(0, H, 0, H - ed, ea); ctx.fillRect(0, H - ed, W, ed);
  ctx.fillStyle = edge(0, 0, 0, ed * 0.8, ea * 0.85); ctx.fillRect(0, 0, W, ed * 0.8);
  ctx.fillStyle = edge(0, 0, ed * 0.7, 0, ea * 0.85); ctx.fillRect(0, 0, ed * 0.7, H);
  ctx.fillStyle = edge(W, 0, W - ed * 0.7, 0, ea * 0.85); ctx.fillRect(W - ed * 0.7, 0, ed * 0.7, H);
  // 네 변에서 안쪽으로 솟는 불꽃 혀
  // (ox, oy) 변 위 시작점 · (ux, uy) 변을 따라가는 방향 · (nx, ny) 안쪽 방향 · len 변 길이 · cnt 불꽃 수 · hs 높이 배율
  const tongue = (px, py, ux, uy, nx, ny, w, hgt, sway) => {
    const tx = px + nx * hgt + ux * sway, ty = py + ny * hgt + uy * sway;
    const g = ctx.createLinearGradient(px, py, px + nx * hgt, py + ny * hgt);
    g.addColorStop(0, `rgba(${F.core},${Math.min(0.75, 0.42 * I)})`); g.addColorStop(0.45, `rgba(${F.mid},${Math.min(0.55, 0.28 * I)})`); g.addColorStop(1, `rgba(${F.edge},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(px - ux * w, py - uy * w);
    ctx.quadraticCurveTo(px - ux * w * 0.6 + nx * hgt * 0.55, py - uy * w * 0.6 + ny * hgt * 0.55, tx, ty);
    ctx.quadraticCurveTo(px + ux * w * 0.6 + nx * hgt * 0.55, py + uy * w * 0.6 + ny * hgt * 0.55, px + ux * w, py + uy * w);
    ctx.closePath(); ctx.fill();
  };
  const side = (ox, oy, ux, uy, nx, ny, len, cnt, hs, seed) => {
    for (let i = 0; i < cnt; i++) {
      const t = (i + 0.5) / cnt;
      const hgt = (36 + 26 * Math.sin(now * 7 + i * 1.7 + seed) + 14 * Math.sin(now * 13 + i * 2.9 + seed)) * a1 * (1 + 0.5 * a2) * (0.7 + 0.5 * I) * hs;
      if (hgt < 4) continue;
      tongue(ox + ux * len * t, oy + uy * len * t, ux, uy, nx, ny, len / cnt * 0.8, hgt, Math.sin(now * 11 + i + seed) * len / cnt * 0.35);
    }
  };
  side(0, H, 1, 0, 0, -1, W, 22, 1, 0);          // 아래 (위로 솟음)
  side(0, 0, 1, 0, 0, 1, W, 22, 0.75, 3);        // 위 (아래로 늘어짐)
  side(0, 0, 0, 1, 1, 0, H, 12, 0.75, 7);        // 왼쪽
  side(W, 0, 0, 1, -1, 0, H, 12, 0.75, 11);      // 오른쪽
  // 불티
  for (const e of R.embers) {
    const al = (1 - e.t / e.life) * Math.min(0.85, 0.6 * I);
    ctx.fillStyle = `rgba(${e.t / e.life < 0.4 ? F.core : F.mid},${al})`;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.s * (0.5 + al * 0.5), 0, TAU); ctx.fill();
  }
  ctx.restore();
}
// 화면 위 콤보 숫자 (클수록 커지고 색이 뜨거워진다) + 피버 진입 문구
function drawComboHUD(ctx, now) {
  const c = R.chain;
  if (c >= 3) {
    const size = Math.min(110, 40 + 11 * Math.log2(c + 1));
    const s = 1 + R.chainBump * 0.25;
    const F = FLAME[flameIdx(c)];
    const col = c >= FLAME_STEP ? F.text : c >= FEVER[1].at ? '#fff6d0' : c >= FEVER[0].at ? '#ffe36e' : c >= 10 ? '#ffc04a' : '#ffffff';
    const out = c >= FLAME_STEP ? F.out : c >= FEVER[1].at ? '#c2200a' : c >= FEVER[0].at ? '#d2560e' : '#5a2a00';
    const y = 300;
    ctx.save(); ctx.translate(1590, y); ctx.scale(s, s); ctx.rotate(-0.06);
    if (c >= FEVER[0].at) { ctx.shadowColor = `rgb(${F.mid})`; ctx.shadowBlur = 10; }
    txt(ctx, `${c}`, 0, 0, size, col, 'center', out, Math.max(8, size * 0.1));
    ctx.shadowBlur = 0;
    txt(ctx, 'COMBO', 0, size * 0.62, Math.max(26, size * 0.32), col, 'center', out, 6);
    ctx.restore();
    if (R.fever) txt(ctx, `${F.icon} 점수 ×${feverMul()}`, 1590, y + size * 0.62 + 36, 24, col, 'center', out, 5);
  }
  if (R.feverMsg) {
    const m = R.feverMsg, k = m.t;
    const sc = k < 0.18 ? 0.4 + k / 0.18 * 0.8 : 1.2 - Math.min(0.2, (k - 0.18) * 0.4);
    ctx.globalAlpha = k > 1.2 ? Math.max(0, (1.6 - k) / 0.4) : 1;
    ctx.save(); ctx.translate(960, 470); ctx.scale(sc, sc); ctx.rotate(-0.05);
    const MF = m.pal != null ? FLAME[m.pal] : null;
    ctx.shadowColor = MF ? `rgb(${MF.mid})` : '#a03000'; ctx.shadowBlur = 12;
    txt(ctx, m.noIcon ? m.text : `${MF ? MF.icon : '🔥'} ${m.text}`, 0, 0, m.lv === 2 ? 92 : 80, MF ? MF.text : '#ffe9a0', 'center', MF ? MF.out : '#a01a08', 10);
    if (m.sub) { ctx.shadowBlur = 0; txt(ctx, m.sub, 0, 74, 36, MF ? MF.text : '#ffe9a0', 'center', MF ? MF.out : '#a01a08', 6); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

// ===== 라운드 화면 그리기 =====
const HUD_SLOTS = { ed: { x: 66, y: 186 }, md: { x: 66, y: 244 }, ps: { x: 66, y: 302 } };
const CODEX_BTN = { x: 1716, y: 978, w: 176, h: 64 };
const FONT = '"Jua", "Malgun Gothic", sans-serif';
let OVL = null;

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function woodPanel(ctx, x, y, w, h, r = 16) {
  roundRect(ctx, x, y, w, h, r); ctx.fillStyle = '#7a4f2e'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#3b2414'; ctx.stroke();
  roundRect(ctx, x + 7, y + 7, w - 14, h - 14, r - 6); ctx.fillStyle = '#f6ead2'; ctx.fill();
}
function txt(ctx, s, x, y, size, col, align = 'center', stroke = null, sw = 5) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function drawShroom(ctx, m) {
  const spr = m.cluster ? heapSprite(m.sp, m.r, m.golden) : shroomSprite(m.sp, m.r, m.golden, 0);
  const s = spr.width;
  const sq = m.squish;
  const gs = m.grow < 1 ? (1 - Math.pow(1 - m.grow, 3)) : 1;
  const sx = gs * (1 + sq * 0.18), sy = gs * (1 - sq * 0.2);
  ctx.save();
  ctx.translate(m.x, m.y + m.r * 0.3);
  ctx.scale(sx, sy);
  ctx.drawImage(spr, -s / 2, -s / 2 - m.r * 0.3);
  ctx.restore();
}

function drawRound(ctx) {
  const st = R.st, now = performance.now() / 1000;
  ctx.save();
  if (R.shake > 0) ctx.translate(rand(-1, 1) * R.shake * 8, rand(-1, 1) * R.shake * 8);
  ctx.scale(ZOOM, ZOOM);   // 필드(월드) 좌표 → 화면
  ctx.drawImage(R.bg || BG, 0, 0);

  // 숲 장치
  for (const d of R.devices) drawDevice(ctx, d, now);

  // 버섯 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (const m of R.shrooms) { if (m.wall) continue; ctx.beginPath(); ctx.ellipse(m.x, m.y + m.r * 0.85, m.r * 0.9 * m.grow, m.r * 0.3 * m.grow, 0, 0, TAU); ctx.fill(); }
  // 거대 버섯 예고 그림자
  if (R.giantWarn) {
    const k = R.giantWarn.t;
    ctx.fillStyle = `rgba(40,25,10,${0.25 + 0.2 * Math.sin(now * 20)})`;
    ctx.beginPath(); ctx.ellipse(R.giantWarn.x, R.giantWarn.y + 60, 100 * (0.5 + k * 0.5), 36 * (0.5 + k * 0.5), 0, 0, TAU); ctx.fill();
  }
  // 발광 후광 (보름달 밤)
  const night = st.wId === 'moon' || st.theme.id === 'night';
  // 벽 군락지는 필드 안쪽만 보이게
  ctx.save();
  ctx.beginPath(); ctx.rect(FX0 - 2, FY0 - 2, FX1 - FX0 + 4, FY1 - FY0 + 4); ctx.clip();
  const sorted = R.shrooms.slice().sort((a, b) => a.y - b.y);
  for (const m of sorted) {
    if (m.golden && Math.random() < 0.02) addPart(m.x + rand(-m.r, m.r), m.y + rand(-m.r, m.r), 0, -30, 0.5, '#fff3a0', 3);
    drawShroom(ctx, m);
    if (m.giant) {
      const k = 1 - m.hp / m.maxHp;
      ctx.strokeStyle = 'rgba(40,20,10,0.8)'; ctx.lineWidth = 4;
      const rnd = seeded(5);
      for (let i = 0; i < Math.floor(k * 8); i++) {
        const x = m.x + (rnd() - 0.5) * 120, y = m.y - 40 + (rnd() - 0.5) * 60;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (rnd() - 0.5) * 50, y + rnd() * 30); ctx.lineTo(x + (rnd() - 0.5) * 60, y + rnd() * 50); ctx.stroke();
      }
    }
  }
  if (R.special) drawSpecialInField(ctx, R.special, now);
  ctx.restore();
  // HP 바 (피해 받은 고급 이상)
  for (const m of R.shrooms) {
    if (m.hp >= m.maxHp || (m.sp.t === 0 && !m.giant && !m.cluster)) continue;
    const w = m.giant ? 160 : m.cluster ? m.r * 1.5 : m.r * 1.8, y = m.y - m.r - (m.giant ? 30 : 10);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(m.x - w / 2 - 1, y - 1, w + 2, m.giant ? 10 : 6);
    ctx.fillStyle = m.giant ? '#ff6b6b' : TIERS[m.sp.t].color; ctx.fillRect(m.x - w / 2, y, w * Math.max(0, m.hp / m.maxHp), m.giant ? 8 : 4);
  }
  // 포자 구름
  for (const c of R.clouds) {
    const a = Math.min(1, c.t / 0.5) * 0.35;
    const col = c.slow && c.weak ? '150,110,170' : c.slow ? '160,120,200' : '150,150,150';
    for (let i = 0; i < 6; i++) {
      const ang = i / 6 * TAU + now * 0.5;
      ctx.fillStyle = `rgba(${col},${a})`;
      ctx.beginPath(); ctx.arc(c.x + Math.cos(ang) * 50, c.y + Math.sin(ang) * 40, 60, 0, TAU); ctx.fill();
    }
  }
  // 충격파·포자 폭발 고리
  for (const r of R.rings) {
    const k = r.t / r.dur;
    ctx.strokeStyle = r.col; ctx.globalAlpha = 1 - k; ctx.lineWidth = r.quiet ? 3 : 8 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.3 + 0.7 * Math.sqrt(k)), 0, TAU); ctx.stroke();
    if (!r.quiet) { ctx.fillStyle = r.col; ctx.globalAlpha = (1 - k) * 0.25; ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  for (const w of R.waves) {
    const k = w.t / 0.4;
    ctx.strokeStyle = '#ffd9a8'; ctx.globalAlpha = 1 - k; ctx.lineWidth = 10 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }
  // 회오리
  for (const tn of R.tornados) {
    const tg = ctx.createLinearGradient(tn.x, 0, tn.x - tn.dir * 300, 0);
    tg.addColorStop(0, 'rgba(200,245,235,0.18)'); tg.addColorStop(1, 'rgba(200,245,235,0)');
    ctx.fillStyle = tg; ctx.fillRect(Math.min(tn.x, tn.x - tn.dir * 300), tn.y - tn.h / 2, 300, tn.h);
    ctx.save(); ctx.translate(tn.x, tn.y);
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(230,255,250,${0.8 - i * 0.12})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(0, (i - 2) * tn.h / 5, 30 + i * 6, 8, now * 10 + i, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  // 번개
  for (const bo of R.bolts) {
    ctx.strokeStyle = bo.slash ? '#f4f8ff' : '#fff9a0'; ctx.lineWidth = bo.big ? 6 : bo.slash ? 7 : 4; ctx.globalAlpha = Math.min(1, bo.t / 0.15);
    ctx.shadowColor = '#fff36b'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(bo.pts[0].x, bo.pts[0].y);
    for (let i = 1; i < bo.pts.length; i++) {
      const a = bo.pts[i - 1], b = bo.pts[i];
      const j = bo.slash ? 0 : 14;   // 낫 휘두르기는 곧은 칼선
      for (let k = 1; k <= 4; k++) { const t = k / 4; ctx.lineTo(lerp(a.x, b.x, t) + (k < 4 ? rand(-j, j) : 0), lerp(a.y, b.y, t) + (k < 4 ? rand(-j, j) : 0)); }
    }
    ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // 핀볼
  for (const b of R.balls) drawBall(ctx, b, now);

  // 슬라이드 바 (통나무)
  drawBar(ctx);

  // 조준 화살표
  if (R.phase === 'aim') {
    const b0 = R.balls[0];
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(LAUNCH.x, LAUNCH.y, 70 + Math.sin(now * 4) * 6, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    if (R.aim) {
      const dx = R.aim.sx - R.aim.x, dy = R.aim.sy - R.aim.y, len = Math.hypot(dx, dy);
      if (len >= 20) {
        const a = Math.atan2(dy, dx), L = 90 + Math.min(len, 220) * 1.1;
        const n = R.balls.length;
        for (let i = 0; i < n; i++) {
          const off = n > 1 ? (-8 + 16 * i / (n - 1)) * Math.PI / 180 : 0;
          drawArrow(ctx, b0.x, b0.y, a + off, L, i === Math.floor(n / 2) ? 1 : 0.5);
        }
      }
    }
  }

  // 파티클
  for (const p of R.parts) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 날씨 덮개
  drawWeather(ctx, now);
  if (night) {
    for (const m of R.shrooms) {
      if (!m.sp.glow) continue;
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 3);
      g.addColorStop(0, m.sp.c === 'ps' && m.sp.sh === 'fan' ? 'rgba(140,255,160,0.5)' : 'rgba(255,250,200,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 3, 0, TAU); ctx.fill();
      drawShroom(ctx, m);
    }
  }
  // 풍년
  if (R.festOn) {
    ctx.fillStyle = `rgba(255,190,60,${0.05 + 0.02 * Math.sin(now * 8)})`; ctx.fillRect(0, 0, W, H);
  }
  if (R.acornT > 0) { ctx.strokeStyle = `rgba(255,220,100,${0.4 + 0.2 * Math.sin(now * 10)})`; ctx.lineWidth = 12; ctx.strokeRect(FX0 + 6, FY0 + 6, FX1 - FX0 - 12, FY1 - FY0 - 12); }

  // 떠오르는 숫자
  for (const t of R.texts) {
    const life = t.tier >= 2 ? 1.2 : 0.8, k = t.t / life;
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    const size = [18, 21, 26, 32][t.tier] * (t.crit ? 1.1 : 1) * (t.t < 0.1 ? 0.6 + t.t * 4 : 1);
    const col = t.coin ? '#ffd23a' : t.golden ? '#ffd23a' : t.crit ? '#ff5a4a' : ['#ffffff', '#9fd8ff', '#e6b3ff', '#ffc94a'][t.tier];
    txt(ctx, t.coin ? `+${fmtN(t.v, 1)}G` : (t.crit ? '치명! ' : '+') + fmt(t.v), t.x, t.y, size, col, 'center', '#2a1a10', 5);
  }
  ctx.globalAlpha = 1;
  for (const l of R.labels) {
    ctx.globalAlpha = l.t > 1 ? (1.4 - l.t) / 0.4 : 1;
    const s = l.size * (l.t < 0.12 ? 0.5 + l.t * 4 : 1);
    txt(ctx, l.text, l.x, l.y, s, l.col, 'center', '#2a1a10', 6);
  }
  ctx.globalAlpha = 1;
  // 날아가는 버섯
  for (const f of R.flyers) {
    if (f.t < 0) continue;
    if (f.clock) { txt(ctx, '⏱️', f.x, f.y, 26, '#fff'); continue; }
    const spr = shroomSprite(f.sp, 16, f.golden, 0);
    ctx.drawImage(spr, f.x - spr.width / 2, f.y - spr.height / 2);
  }
  ctx.restore();

  drawFever(ctx, now);
  drawHUD(ctx, now);
  drawComboHUD(ctx, now);
  if (R.flash > 0) { ctx.fillStyle = `rgba(255,255,240,${R.flash * 0.3})`; ctx.fillRect(0, 0, W, H); }
}

function drawSpecialInField(ctx, sm, now) {
  const k = clamp(sm.t / sm.max, 0, 1), a = sm.appear, hop = Math.abs(Math.sin(now * 8)) * 8;
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(sm.x, sm.y + sm.r * 0.95, sm.r * 0.8, sm.r * 0.25, 0, 0, TAU); ctx.fill();
  // 남은 시간 고리
  const rr = sm.r + 22;
  ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(sm.x, sm.y, rr, 0, TAU); ctx.stroke();
  ctx.strokeStyle = k < 0.3 ? (Math.sin(now * 14) > 0 ? '#ff5a4a' : '#ffd23a') : sm.kind.c1;
  ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(sm.x, sm.y, rr, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  ctx.save(); ctx.translate(sm.x, sm.y - hop); ctx.scale(a * (1 + sm.squish * 0.2), a * (1 - sm.squish * 0.2));
  drawSpecialChar(ctx, sm.kind, sm.r, now);
  ctx.restore();
  const w = 80, y = sm.y - rr - 14;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sm.x - w / 2 - 1, y - 1, w + 2, 8);
  ctx.fillStyle = sm.kind.c1; ctx.fillRect(sm.x - w / 2, y, w * Math.max(0, sm.hp / sm.maxHp), 6);
  txt(ctx, `${sm.kind.n} ${sm.t.toFixed(1)}초`, sm.x, y - 16, 18, '#fff', 'center', '#2a1a10', 4);
}

function drawArrow(ctx, x, y, a, L, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(0, 0, L, 0); g.addColorStop(0, 'rgba(255,220,60,0)'); g.addColorStop(1, '#ffd23a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(20, -7); ctx.lineTo(L - 30, -9); ctx.lineTo(L - 30, -22); ctx.lineTo(L, 0); ctx.lineTo(L - 30, 22); ctx.lineTo(L - 30, 9); ctx.lineTo(20, 7); ctx.closePath();
  ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(120,70,0,0.8)'; ctx.stroke();
  ctx.restore();
}

function drawBall(ctx, b, now) {
  const st = R.st;
  // 잔상
  const busy = !b.perm && R.balls.length > 12;   // 핀볼이 많으면 임시 핀볼의 장식은 생략
  if (b.trail.length >= 4 && !busy) {
    ctx.strokeStyle = b.moss > 0 ? 'rgba(120,220,120,0.28)' : b.accel > 0 ? 'rgba(120,200,255,0.3)' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = b.r * 0.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.trail[0], b.trail[1]);
    for (let i = 2; i < b.trail.length; i += 2) ctx.lineTo(b.trail[i], b.trail[i + 1]);
    ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.lineCap = 'butt';
  }
  const alpha = b.perm ? 1 : Math.min(0.85, b.life / 1);
  if ((st.blade || b.hv === 'mill') && !busy) {
    const rr = bladeRadius(b);
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(now * 6);
    ctx.strokeStyle = b.bladeFx > 0 ? 'rgba(255,255,255,0.55)' : 'rgba(230,230,255,0.2)'; ctx.lineWidth = b.bladeFx > 0 ? 3 : 2;
    ctx.setLineDash([14, 10]); ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
  if (b.accel > 0 || b.clear > 0 || b.sharpen > 0) {
    ctx.fillStyle = b.clear > 0 ? 'rgba(190,245,255,0.18)' : b.sharpen > 0 ? 'rgba(255,255,255,0.18)' : 'rgba(110,210,255,0.18)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.6, 0, TAU); ctx.fill();
  }
  if (st.fire && !busy) {
    // 화염 이펙트 (특수 버섯 '불씨 꼬마' 보상) — 은은하게
    const fg = ctx.createRadialGradient(b.x, b.y, b.r * 0.4, b.x, b.y, b.r * 1.4);
    fg.addColorStop(0, 'rgba(255,170,60,0.22)'); fg.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.4, 0, TAU); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * 0.5, fl = b.r * (0.55 + 0.25 * Math.sin(now * 18 + i * 1.7));
      ctx.fillStyle = i === 1 ? 'rgba(255,190,70,0.45)' : 'rgba(240,110,30,0.38)';
      ctx.beginPath(); ctx.moveTo(b.x + Math.cos(a - 0.25) * b.r * 0.85, b.y + Math.sin(a - 0.25) * b.r * 0.85);
      ctx.quadraticCurveTo(b.x + Math.cos(a) * (b.r + fl), b.y + Math.sin(a) * (b.r + fl), b.x + Math.cos(a + 0.25) * b.r * 0.85, b.y + Math.sin(a + 0.25) * b.r * 0.85);
      ctx.fill();
    }
  }
  ctx.save(); ctx.translate(b.x, b.y);
  drawHarvester(ctx, b.hv, b.r, b.ang, alpha, b.hs);
  ctx.restore();
  // 디버프 포자 (보라: 느림, 회색: 약화)
  if (b.slow > 0 || b.weak > 0) {
    for (let i = 0; i < 4; i++) {
      const a = now * 4 + i * TAU / 4;
      ctx.fillStyle = (i % 2 && b.weak > 0) || b.slow <= 0 ? 'rgba(140,140,140,0.9)' : 'rgba(170,110,220,0.9)';
      ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * b.r * 1.4, b.y + Math.sin(a) * b.r * 1.4, 4, 0, TAU); ctx.fill();
    }
  }
  if (b.combo >= 3 && b.perm) txt(ctx, 'x' + b.combo, b.x, b.y - b.r - 14, 16, '#fff3b0', 'center', '#2a1a10', 4);
}

function drawBar(ctx) {
  const bar = R.bar, x0 = bar.x - bar.len / 2, y = BAR_Y - BAR_T / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; roundRect(ctx, x0 + 4, y + 8, bar.len, BAR_T + 4, 8); ctx.fill();
  roundRect(ctx, x0, y - 3, bar.len, BAR_T + 6, 9);
  const g = ctx.createLinearGradient(0, y - 3, 0, y + BAR_T + 3); g.addColorStop(0, '#c88b52'); g.addColorStop(1, '#7a4a24');
  ctx.fillStyle = bar.fx > 0 ? '#ffe2a0' : g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#3b2414'; ctx.stroke();
  ctx.strokeStyle = 'rgba(60,30,10,0.4)'; ctx.lineWidth = 2;
  for (let x = x0 + 20; x < x0 + bar.len - 10; x += 26) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 8, y + BAR_T); ctx.stroke(); }
  for (const e of [x0, x0 + bar.len]) { ctx.beginPath(); ctx.ellipse(e, y + BAR_T / 2, 7, 12, 0, 0, TAU); ctx.fillStyle = '#e0b07a'; ctx.fill(); ctx.stroke(); }
  // 잎사귀
  ctx.fillStyle = '#5fae3f';
  ctx.beginPath(); ctx.ellipse(x0 + 12, y - 6, 10, 5, -0.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x0 + bar.len - 14, y - 6, 10, 5, 0.6, 0, TAU); ctx.fill();
  // 피버 중: 바도 지금 불꽃 색으로 물든다 (불꽃 단계 FLAME · 진하기 flameInt를 그대로 따라감)
  const k = Math.min(1, R.feverK);
  if (k > 0.03) {
    const F = FLAME[R.flamePal] || FLAME[0], I = R.flameInt, now = performance.now() / 1000;
    ctx.save();
    ctx.globalAlpha = k * Math.min(1, 0.55 + 0.4 * I);
    ctx.shadowColor = `rgb(${F.mid})`; ctx.shadowBlur = (10 + 14 * I) * (0.85 + 0.15 * Math.sin(now * 8));
    roundRect(ctx, x0, y - 3, bar.len, BAR_T + 6, 9);
    const fg = ctx.createLinearGradient(0, y - 3, 0, y + BAR_T + 3);
    fg.addColorStop(0, `rgb(${F.core})`); fg.addColorStop(0.55, `rgb(${F.mid})`); fg.addColorStop(1, `rgb(${F.edge})`);
    ctx.fillStyle = fg; ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = `rgb(${F.edge})`; ctx.stroke();
    // 바 위로 너울거리는 작은 불꽃
    const n = Math.max(3, Math.round(bar.len / 40));
    for (let i = 0; i < n; i++) {
      const fx = x0 + (i + 0.5) / n * bar.len, fh = (8 + 6 * Math.sin(now * 12 + i * 1.9)) * (0.6 + 0.6 * I);
      const tg = ctx.createLinearGradient(0, y, 0, y - fh);
      tg.addColorStop(0, `rgba(${F.core},0.8)`); tg.addColorStop(1, `rgba(${F.mid},0)`);
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.moveTo(fx - 7, y); ctx.quadraticCurveTo(fx - 3, y - fh * 0.6, fx + Math.sin(now * 9 + i) * 3, y - fh); ctx.quadraticCurveTo(fx + 3, y - fh * 0.6, fx + 7, y); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function drawDevice(ctx, d, now) {
  switch (d.type) {
    case 'stump': {
      const s = d.hitT > 0 ? 1.12 : 1;
      ctx.save(); ctx.translate(d.x, d.y); ctx.scale(s, s);
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(4, 10, 42, 30, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fillStyle = '#8b5a33'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#3b2414'; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 31, 0, TAU); ctx.fillStyle = d.hitT > 0 ? '#fff0b0' : '#e5c08a'; ctx.fill();
      ctx.strokeStyle = '#b4884f'; ctx.lineWidth = 2; for (const r of [8, 16, 24]) { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke(); }
      ctx.restore();
      break;
    }
    case 'moss': {
      roundRect(ctx, d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0, 22);
      ctx.fillStyle = 'rgba(70,160,70,0.85)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#2f6e2a'; ctx.stroke();
      const rnd = seeded(Math.floor(d.x0));
      for (let i = 0; i < 26; i++) {
        const x = lerp(d.x0 + 8, d.x1 - 8, rnd()), y = lerp(d.y0 + 8, d.y1 - 8, rnd());
        ctx.fillStyle = `rgba(200,255,160,${0.4 + 0.4 * Math.sin(now * 3 + i)})`; ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill();
      }
      break;
    }
    case 'mole':
      for (const p of [d.a, d.b]) {
        ctx.beginPath(); ctx.ellipse(p.x, p.y + 6, 40, 26, 0, 0, TAU); ctx.fillStyle = '#9a7248'; ctx.fill();
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 30, 22, 0, 0, TAU); ctx.fillStyle = '#2a1a10'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#5a3a20'; ctx.stroke();
      }
      ctx.setLineDash([6, 12]); ctx.strokeStyle = 'rgba(90,60,30,0.3)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(d.a.x, d.a.y); ctx.lineTo(d.b.x, d.b.y); ctx.stroke(); ctx.setLineDash([]);
      break;
    case 'stream': {
      ctx.fillStyle = 'rgba(90,170,230,0.75)'; ctx.fillRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
      ctx.strokeStyle = 'rgba(40,90,140,0.7)'; ctx.lineWidth = 3; ctx.strokeRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
      const off = (now * 250) % 80;
      if (d.fx) {
        for (let x = d.x0 - 80; x < d.x1; x += 80) for (const yy of [0.3, 0.7]) {
          const xx = x + (d.fx > 0 ? off : 80 - off), y = lerp(d.y0, d.y1, yy);
          if (xx < d.x0 || xx + 30 > d.x1) continue;
          ctx.beginPath(); ctx.moveTo(xx, y); ctx.lineTo(xx + 30, y); ctx.stroke();
          ctx.beginPath(); const hx = d.fx > 0 ? xx + 30 : xx; ctx.moveTo(hx - d.fx * 8, y - 6); ctx.lineTo(hx, y); ctx.lineTo(hx - d.fx * 8, y + 6); ctx.stroke();
        }
      } else {
        for (let y = d.y0 - 80; y < d.y1; y += 80) for (const xx of [0.3, 0.7]) {
          const yy = y + (d.fy > 0 ? off : 80 - off), x = lerp(d.x0, d.x1, xx);
          if (yy < d.y0 || yy + 30 > d.y1) continue;
          ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x, yy + 30); ctx.stroke();
          const hy = d.fy > 0 ? yy + 30 : yy; ctx.beginPath(); ctx.moveTo(x - 6, hy - d.fy * 8); ctx.lineTo(x, hy); ctx.lineTo(x + 6, hy - d.fy * 8); ctx.stroke();
        }
      }
      break;
    }
    case 'acorn':
      d.pts.forEach((p, i) => {
        if (d.lit[i]) { const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 34); g.addColorStop(0, 'rgba(255,230,120,0.8)'); g.addColorStop(1, 'rgba(255,230,120,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, TAU); ctx.fill(); }
        ctx.beginPath(); ctx.ellipse(p.x, p.y + 3, 13, 15, 0, 0, TAU); ctx.fillStyle = d.lit[i] ? '#ffcf5a' : '#b8844a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OL; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(p.x, p.y - 6, 15, 8, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = '#6b4424'; ctx.fill(); ctx.stroke();
      });
      break;
  }
}

function drawWeather(ctx, now) {
  const w = R.st.wId;
  const night = R.st.theme.id === 'night';   // 달빛 밤 지역: 보름달보다 덜 어두운 밤
  if (w === 'fog' || w === 'moon' || night) {
    if (!OVL) { OVL = document.createElement('canvas'); OVL.width = W; OVL.height = H; }
    const o = OVL.getContext('2d');
    o.globalCompositeOperation = 'source-over';
    o.clearRect(0, 0, W, H);
    o.fillStyle = w === 'fog' ? 'rgba(235,240,240,0.78)' : w === 'moon' ? 'rgba(10,15,45,0.62)' : 'rgba(10,15,45,0.42)';
    o.fillRect(0, 0, W, H);
    o.globalCompositeOperation = 'destination-out';
    const rad = w === 'fog' ? 330 : 260;
    for (const b of R.balls) {
      const g = o.createRadialGradient(b.x, b.y, 0, b.x, b.y, rad);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.8)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      o.fillStyle = g; o.beginPath(); o.arc(b.x, b.y, rad, 0, TAU); o.fill();
    }
    const g = o.createRadialGradient(R.bar.x, BAR_Y, 0, R.bar.x, BAR_Y, 240);
    g.addColorStop(0, 'rgba(0,0,0,0.9)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = g; o.beginPath(); o.arc(R.bar.x, BAR_Y, 240, 0, TAU); o.fill();
    ctx.drawImage(OVL, 0, 0);
    if (w === 'moon' || night) txt(ctx, w === 'moon' ? '🌕' : '🌙', WW - 120, 110, 60, '#fff');
  }
  if (w === 'rain' || w === 'storm') {
    const n = w === 'storm' ? 220 : 80;
    if (w === 'storm') { ctx.fillStyle = 'rgba(20,30,60,0.25)'; ctx.fillRect(0, 0, W, H); }
    ctx.strokeStyle = w === 'storm' ? 'rgba(190,215,255,0.6)' : 'rgba(200,225,255,0.45)'; ctx.lineWidth = 2;
    for (let i = 0; i < n; i++) { const x = (i * 97 + now * 300) % W, y = (i * 53 + now * (w === 'storm' ? 1400 : 900)) % H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8, y + (w === 'storm' ? 34 : 22)); ctx.stroke(); }
  } else if (w === 'cold') {
    ctx.fillStyle = 'rgba(190,225,255,0.22)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 70; i++) { const x = (i * 131 + Math.sin(now + i) * 30) % W, y = (i * 67 + now * 60) % H; ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, TAU); ctx.fill(); }
  } else if (w === 'drought') {
    ctx.fillStyle = 'rgba(230,150,60,0.18)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,220,160,0.25)'; ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) { const y = (i * 90 + now * 40) % H; ctx.beginPath(); for (let x = 0; x <= W; x += 60) ctx.lineTo(x, y + Math.sin(x / 80 + now * 3 + i) * 6); ctx.stroke(); }
  } else if (w === 'autumn') {
    for (let i = 0; i < 30; i++) {
      const x = (i * 131 + now * 60 + Math.sin(now + i) * 40) % W, y = (i * 71 + now * 80) % H;
      ctx.fillStyle = ['#e8892a', '#d9542a', '#f2c14e'][i % 3]; ctx.save(); ctx.translate(x, y); ctx.rotate(now + i);
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, TAU); ctx.fill(); ctx.restore();
    }

      if (n.core) { ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.fillStyle = br.color; ctx.fill(); txt(ctx, n.br === 'ed' ? '💰' : n.br === 'md' ? '🎯' : '⚔️', 0, 1, r * 0.7, '#fff'); }
      else if (L === 0) { ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, TAU); ctx.fillStyle = br.color; ctx.fill(); }
      else {
        ctx.save();
        const full = st === 'max', sc = full ? 1.15 : 0.8;
        ctx.scale(sc, sc);
        stemPath(ctx, r * 0.7, 0.25, 0.1, 0.9, '#f4ead8', 2);
        domeCap(ctx, r * 0.7, full ? 1.1 : 0.85, full ? -0.8 : -0.7, 0.15, br.color, 2, full ? 'dots' : '', '#fff', { n: n.id });
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      // 오른쪽 위 배지: ▲ 강화 가능 · ! 골드 부족 · ★ 최대
      const bx = r * 0.78, by = -r * 0.78, bR = n.sub ? 7 : 9;
      ctx.beginPath(); ctx.arc(bx, by, bR, 0, TAU); ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#241810'; ctx.stroke();
      txt(ctx, st === 'buy' ? '▲' : st === 'poor' ? '!' : '★', bx, by + 1, bR * 1.3, st === 'max' ? '#5a3a00' : '#fff');
    }
    ctx.restore();
    if (n.core) { txt(ctx, st === 'max' ? '열림' : `${fmt(cost.gold)}G`, n.x, n.y + r + 14, 14, NODE_TXT[st], 'center', '#241810', 3); continue; }
    if (st !== 'locked' && (!n.sub || hov || c.z > 0.8)) {
      const label = n.sub ? n.n.replace(/^.* /, '') : n.n;
      txt(ctx, label, n.x, n.y + r + 14, n.sub ? 15 : 18, st === 'poor' ? '#cbbfa8' : '#fff6e0', 'center', '#241810', 4);
      // 둘째 줄: 레벨 + 다음 강화 비용 (상태 색)
      const lvTxt = n.max > 1 ? `Lv ${L}/${n.max}` : '';
      const line2 = st === 'max' ? (n.max > 1 ? `MAX ${L}/${n.max}` : 'MAX') : `${lvTxt}${lvTxt ? ' · ' : ''}${fmt(cost.gold)}G`;
      txt(ctx, line2, n.x, n.y + r + 32, 13, NODE_TXT[st], 'center', '#241810', 3);

}

function treeHit(sx, sy) {
  const p = s2w(sx, sy);
  let best = null, bd = 1e9;
  for (const n of NODES) {
    if (nodeState(n) === 'hidden') continue;
    const dd = d2(p.x, p.y, n.x, n.y), r = nodeR(n) + 8;
    if (dd < r * r && dd < bd) { bd = dd; best = n; }
  }
  return best;
}
function treeMouseDown(x, y) { TREE.drag = { x, y, cx: TREE.cam.x, cy: TREE.cam.y, moved: false }; }
function treeMouseMove(x, y) {
  if (TREE.drag) {
    const dx = x - TREE.drag.x, dy = y - TREE.drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) TREE.drag.moved = true;
    if (TREE.drag.moved) { TREE.cam.x = TREE.drag.cx - dx / TREE.cam.z; TREE.cam.y = TREE.drag.cy - dy / TREE.cam.z; }
  }
  const h = treeHit(x, y);
  TREE.hover = h;
  showNodeTip(h, x, y);
}
// max = true(Shift+클릭·우클릭)면 골드가 허락하는 만큼 그 노드를 끝까지 올린다
function treeMouseUp(x, y, max) {
  const d = TREE.drag; TREE.drag = null;
  if (d && d.moved) return;
  const n = treeHit(x, y);
  if (!n) return;
  const s = nodeState(n);
  if (s === 'locked') { Snd.err(); toast('선행 노드를 먼저 사야 열려요'); return; }
  if (s === 'max') return;
  const before = lv(n.id);
  const k = max ? buyMax(n) : buyNode(n) ? 1 : 0;
  if (k) {
    Snd.buy(); if (before === 0) TREE.anim[n.id] = 0;
    updateTopbar(); showNodeTip(n, x, y);
    burstDom(x, y, CATS[n.br].color);
    if (k > 1) toast(`${n.n} +${k}단계 한 번에 강화!`);
  } else { Snd.err(); toast('골드가 부족해요'); }
}

// ===== 일괄 강화 =====
function buyMax(n) { let k = 0; while (buyNode(n)) k++; return k; }
// brs: 강화할 가지들 · reserve: 남겨 둘 골드. 가장 싼 강화부터 산다. dry = true면 결과만 계산하고 되돌린다
function bulkBuy(brs, reserve, dry) {
  const save = { nodes: Object.assign({}, G.nodes), gold: G.gold };
  let levels = 0, spent = 0;
  for (let guard = 0; guard < 3000; guard++) {
    let best = null, bc = Infinity;
    for (const n of NODES) {
      if (!brs.includes(n.br)) continue;
      const st = nodeState(n); if (st !== 'avail' && st !== 'owned') continue;
      const c = nodeCost(n, lv(n.id)).gold; if (c < bc) { bc = c; best = n; }
    }
    if (!best || G.gold - bc < reserve) break;
    G.gold -= bc; G.nodes[best.id] = lv(best.id) + 1; levels++; spent += bc;
  }
  if (dry) { G.nodes = save.nodes; G.gold = save.gold; } else saveGame();
  return { levels, spent };
}

function doBulk() {

function treeWheel(x, y, dy) {
  const before = s2w(x, y);
  TREE.cam.z = clamp(TREE.cam.z * (dy > 0 ? 0.9 : 1.1), 0.3, 1.8);
  const after = s2w(x, y);
  TREE.cam.x += before.x - after.x; TREE.cam.y += before.y - after.y;
}

          <div class="crec">${unlockText(sp)} · HP ${TIERS[sp.t].hp} · 수확량 ${TIERS[sp.t].drop} (무더기: HP ×5, 수확 ×7~10)${h ? ` · 처음 딴 라운드 ${e.first} · 누적 수확 ${fmt(e.n)}개 · 창고 ${fmt(invCount(sp.id))}개 · 황금 ${e.gold ? '✔' : '✘'} · 거대 ${e.giant ? '✔' : '✘'}` : ''}</div>

    } else {

        <div class="cdesc">아직 해금되지 않은 버섯이에요. 이름과 특징은 해금 전까지 가려져 있어요.</div>

  }).join('');
  const abSum = starAbilities();
  const abList = Object.keys(AB).map(k => `<div class="abrow ${abSum[k] ? '' : 'zero'}"><span>${AB[k].n}</span><b>${abFmt(k, abSum[k])}</b></div>`).join('');
  const gc = goldenCount();
  const gold = `<div class="setrow ${gc >= 5 ? 'done' : ''}"><b>황금 도감</b> <span class="prog">${gc}/${SP_TOTAL}</span><span class="eff">5종 골드 +10% · 15종 +25%·황금 수확기 · ${SP_TOTAL}종 +60%</span></div>`;
  openModal(`
    <h2>📖 버섯 도감 <span class="count">${codexCount()}/${SP_TOTAL}</span></h2>
    <div class="sub">버섯은 자동으로 해금돼요: 앞 버섯을 정해진 수만큼 수확하거나(🌱), 세금을 정해진 횟수만큼 내거나(🧾), 새 지역이 열리면(🌲🌙🌾🌊🏚️ 그 지역 전용) 열립니다. 같은 버섯을 많이 딸수록 별(최대 5성)이 붙고, 별마다 그 버섯의 고유 능력치가 영구로 올라요. 상점에서 팔아도 도감·별은 그대로예요.</div>
    <div class="ccols">${cols}</div>
    <div class="cbottom">
      <div class="cleft">
        <div class="sprow"><div class="sets-h">특수 버섯 <small>${spCount}/${SPECIALS.length}</small></div><div class="spgrid">${specials}</div></div>
        ${detail}
      </div>
      <div class="sets"><div class="sets-h">★ 별 능력 합계 <small>(${SPECIES.reduce((a, x) => a + starOf(x.id), 0)}/${SP_TOTAL * 5}별)</small></div>${abList}<div class="sets-h" style="margin-top:10px">세트 보너스</div>${sets}${gold}</div>
    </div>`, 'codex', inRound ? () => { R.paused = false; } : () => updateTopbar());
}

// ===== 버섯 요리 · 마을 의뢰 (버섯 상점의 다른 탭) =====
const shopModeTabs = () => [['sell', '💰 판매'], ['cook', '🍲 요리'], ['quest', '📜 마을 의뢰']]
  .map(([k, n]) => `<button data-act="shopmode" data-mode="${k}" class="tab mode ${SHOP.mode === k ? 'on' : ''}" style="--c:#7a4f2e">${n}${k === 'quest' && questReadyCount() ? ` <i class="dot">${questReadyCount()}</i>` : ''}</button>`).join('');
// 요리 재료 개수: 분류 재료는 스테이지마다 ×1.1, 특정 버섯 재료는 그 제곱근만큼 늘어난다
function recipeNeed(rc) {
  const m = Math.pow(1.1, stageNow() - 1), o = {};
  for (const k in rc.need) o[k] = Math.ceil(rc.need[k] * (CATS[k] ? m : Math.sqrt(m)));
  return o;
}
const needHave = k => (CATS[k] ? invTotal(k) : invCount(SP_BY_NAME[k].id));
const needName = k => (CATS[k] ? `${CATS[k].name} 버섯 아무거나` : harvested(SP_BY_NAME[k].id) ? k : '???');
const recipeKnown = rc => Object.keys(rc.need).every(k => CATS[k] || harvested(SP_BY_NAME[k].id));
function canCook(rc) {
  if ((G.dishes || []).includes(rc.id) || !recipeKnown(rc)) return false;
  const n = recipeNeed(rc);
  return Object.keys(n).every(k => needHave(k) >= n[k]);
}
// 분류 재료는 판매가가 싼 버섯부터 쓴다
function consumeCat(cat, n) {
  const list = SPECIES.filter(sp => sp.c === cat && invCount(sp.id) > 0).sort((a, b) => a.t - b.t || invCount(b.id) - invCount(a.id));
  for (const sp of list) { if (n <= 0) break; const k = Math.min(n, invCount(sp.id)); G.inv[sp.id] -= k; n -= k; }
}
// quiet = true면 화면 갱신·안내 없이 만들기만 (일괄 요리용)
function cook(id, quiet) {
  const rc = RECIPE[id];
  if (!canCook(rc)) { if (!quiet) Snd.err(); return false; }
  const n = recipeNeed(rc);
  for (const k in n) { if (CATS[k]) consumeCat(k, n[k]); else G.inv[SP_BY_NAME[k].id] -= n[k]; }
  G.dishes = (G.dishes || []).concat(id);
  if (quiet) return true;
  saveGame(); Snd.buy(); toast(`${rc.icon} ${rc.n} 완성! 다음 라운드에 먹어요`);
  openShop();
  return true;
}
// 일괄 요리: 지금 만들 수 있는 요리를 위에서부터 전부
function cookAll() {
  const made = RECIPES.filter(rc => cook(rc.id, true));
  if (!made.length) { Snd.err(); toast('지금 만들 수 있는 요리가 없어요'); return; }
  saveGame(); Snd.buy(); toast(`${made.map(rc => rc.icon).join('')} 요리 ${made.length}개 완성! 다음 라운드에 먹어요`);
  openShop();
}
function shopCookHTML() {
  const k = NF.md_chef(lv('md_chef'));
  return RECIPES.map(rc => {
    const known = recipeKnown(rc), n = recipeNeed(rc), done = (G.dishes || []).includes(rc.id), ok = canCook(rc);
    const needs = Object.keys(n).map(key => { const have = needHave(key); return `<span class="${have >= n[key] ? '' : 'lack'}">${needName(key)} ${fmt(Math.min(have, n[key]))}/${fmt(n[key])}</span>`; }).join(' · ');
    return `<div class="reciperow ${done ? 'done' : ''}">
      <div class="ri">${known ? rc.icon : '❔'}</div>
      <div class="rn"><b>${known ? rc.n : '??? 요리'}</b><small>${known ? `다음 라운드 ${rc.eff(k)}` : '재료 버섯을 한 번 수확하면 레시피가 보여요'}</small><div class="rneed">${needs}</div></div>
      <button class="go ${ok ? '' : 'disabled'}" data-act="cook" data-id="${rc.id}">${done ? '준비됨 ✔' : '요리하기'}</button></div>`;
  }).join('');
}

// 마을 의뢰: 주민이 특정 버섯을 원한다. 판매가의 QUEST_MUL배 골드를 준다. 3개씩, 세금 사이클이 바뀌면 새 의뢰.
const QUEST_N = [30, 12, 5, 2];   // 등급별 기본 요구 개수 (스테이지마다 ×1.1)
const QUEST_MUL = 3;
const QUEST_WHO = ['빵집 할머니', '약방 할아버지', '대장장이', '꼬마 사냥꾼', '여관 주인', '연구소 박사', '광장 상인', '숲지기'];
function makeQuest() {
  const pool = SPECIES.filter(sp => harvested(sp.id) && !(G.quests || []).some(q => q.id === sp.id));
  if (!pool.length) return null;
  const sp = pick(pool);
  const cnt = Math.max(1, Math.ceil(QUEST_N[sp.t] * Math.pow(1.1, stageNow() - 1) * rand(0.8, 1.3)));
  return { id: sp.id, cnt, who: pick(QUEST_WHO) };
}
function refreshQuests() {
  G.quests = (G.quests || []).filter(q => SP[q.id]);
  while (G.quests.length < 3) { const q = makeQuest(); if (!q) break; G.quests.push(q); }
}
const questReward = q => Math.floor(q.cnt * unitPrice(SP[q.id]) * QUEST_MUL * NF.ed_trade(lv('ed_trade')));
const questReadyCount = () => (G && G.quests ? G.quests.filter(q => invCount(q.id) >= q.cnt).length : 0);
function doQuest(i) {
  const q = G.quests[i];
  if (!q || invCount(q.id) < q.cnt) { Snd.err(); return; }
  const g = questReward(q);
  G.inv[q.id] -= q.cnt;
  const debt = gainGold(g);
  G.quests.splice(i, 1); refreshQuests();
  saveGame(); Snd.record(); toast(`의뢰 완료! +${fmt(g)}골드${debt ? ` (체납 ${fmt(debt)} 차감)` : ''}`);
  openShop();
}
// 일괄 완료: 지금 전달할 수 있는 의뢰를 전부 (새로 들어온 의뢰도 바로 가능하면 계속)
function questAll() {
  let n = 0, gold = 0, debt = 0;
  for (let guard = 0; guard < 50; guard++) {
    const i = G.quests.findIndex(q => invCount(q.id) >= q.cnt);
    if (i < 0) break;
    const q = G.quests[i], g = questReward(q);
    G.inv[q.id] -= q.cnt; debt += gainGold(g); gold += g; n++;
    G.quests.splice(i, 1); refreshQuests();
  }
  if (!n) { Snd.err(); toast('지금 전달할 수 있는 의뢰가 없어요'); return; }
  saveGame(); Snd.record(); toast(`의뢰 ${n}개 완료! +${fmt(gold)}골드${debt ? ` (체납 ${fmt(debt)} 차감)` : ''}`);
  openShop();
}
function shopQuestHTML() {
  refreshQuests();
  if (!G.quests.length) return '<div class="shop-empty">버섯을 수확하면 마을 사람들이 의뢰를 보내와요.</div>';
  return G.quests.map((q, i) => {
    const sp = SP[q.id], have = invCount(q.id), ok = have >= q.cnt;
    return `<div class="questrow ${ok ? 'ready' : ''}">
      <img src="${shroomURL(sp, 30)}">
      <div class="qn"><small>${q.who}의 부탁</small><b>${sp.n} ${fmt(q.cnt)}개</b><span>창고 ${fmt(have)}/${fmt(q.cnt)} · 보상은 판매가의 ${fmtN(QUEST_MUL * NF.ed_trade(lv('ed_trade')))}배</span></div>
      <button class="go ${ok ? '' : 'disabled'}" data-act="quest" data-i="${i}">전달하기<br><small>+${fmt(questReward(q))}골드</small></button></div>`;
  }).join('');
}
function openShopOther() {
  const body = SHOP.mode === 'cook' ? shopCookHTML() : shopQuestHTML();
  const sub = SHOP.mode === 'cook'
    ? `창고 버섯으로 요리를 만들면 <b>다음 라운드 1번</b> 효과가 붙어요. 종류가 다르면 여러 개를 함께 먹을 수 있어요. 재료 개수는 스테이지마다 늘어나요. (요리 효과 ×${fmtN(NF.md_chef(lv('md_chef')))} · '버섯 요리사' 노드로 강화)`
    : `마을 사람들이 원하는 버섯을 모아 전달하면 <b>판매가보다 훨씬 많은</b> 골드를 줘요. 의뢰는 3개씩이고, 세금 사이클이 바뀌면 새 의뢰로 바뀌어요. ('단골 거래' 노드로 보상 증가)`;
  openModal(`
    <h2>🍄 버섯 상점</h2>

    <div class="res-mini">${SHOP.mode === 'cook'
      ? `<button class="small go ${RECIPES.some(canCook) ? '' : 'disabled'}" data-act="cookall">🍲 일괄 요리</button>`
      : `<button class="small go ${questReadyCount() ? '' : 'disabled'}" data-act="questall">📜 일괄 완료${questReadyCount() ? ` (${questReadyCount()})` : ''}</button>`}<span><img src="${iconURL('gold', 24)}">${fmt(G.gold)}</span></div>
    <div class="shoplist one">${body}</div>`, 'shop', () => { const f = SHOP.onClose; SHOP.onClose = null; SHOP.q = {}; updateTopbar(); if (f) f(); });
}

// ===== 버섯 상점 (창고의 버섯을 골라 개수만큼 판매) =====
// 판매해도 도감 기록·별(G.codex)은 줄지 않는다. 창고(G.inv)만 줄어든다.
const SHOP = { mode: 'sell', tab: 'all', q: {}, onClose: null };   // mode: sell 판매 · cook 요리 · quest 마을 의뢰
function shopList() {
  return SPECIES.filter(sp => invCount(sp.id) >= 1 && (SHOP.tab === 'all' || sp.c === SHOP.tab))
    .sort((a, b) => (CAT_KEYS.indexOf(a.c) - CAT_KEYS.indexOf(b.c)) || (b.t - a.t) || (a.idx - b.idx));
}
const shopQ = id => clamp(Math.floor(SHOP.q[id] != null ? SHOP.q[id] : invCount(id)), 0, invCount(id));
function openShop(tab, onClose) {
  if (tab) SHOP.tab = tab;
  if (onClose !== undefined) SHOP.onClose = onClose;
  if (SHOP.mode !== 'sell') { openShopOther(); return; }
  const keepScroll = modalOpen() && $('panel').classList.contains('shop') ? ($('shoplist') || {}).scrollTop || 0 : 0;
  const pm = priceMul();
  const rows = shopList().map(sp => {
    const have = invCount(sp.id), q = shopQ(sp.id), up = unitPrice(sp, pm), s = starOf(sp.id);
    return `<div class="shoprow" data-id="${sp.id}">
      <img src="${shroomURL(sp, 26)}">
      <div class="sh-name"><b>${sp.n}</b><span><span class="tier t${sp.t}">${TIERS[sp.t].name}</span> ${starHTML(s)}</span></div>
      <div class="sh-have">보유 <b>${fmt(have)}</b>개<br><small>1개 ${fmtN(up, up < 10 ? 2 : 0)}골드</small></div>
      <div class="sh-qty">
        <div class="sh-btns">
          <button class="small" data-act="shopq" data-id="${sp.id}" data-d="-10">−10</button>
          <button class="small" data-act="shopq" data-id="${sp.id}" data-d="-1">−1</button>
          <input type="number" min="0" max="${have}" value="${q}" data-input="shopq" data-id="${sp.id}">
          <button class="small" data-act="shopq" data-id="${sp.id}" data-d="1">+1</button>
          <button class="small" data-act="shopq" data-id="${sp.id}" data-d="10">+10</button>
        </div>
        <div class="sh-btns">
          <button class="small ghost" data-act="shopset" data-id="${sp.id}" data-f="0">0</button>
          <button class="small ghost" data-act="shopset" data-id="${sp.id}" data-f="0.5">절반</button>
          <button class="small ghost" data-act="shopset" data-id="${sp.id}" data-f="1">전부</button>
          <input type="range" min="0" max="${have}" value="${q}" data-input="shopq" data-id="${sp.id}">
        </div>
      </div>
      <button class="go sh-sell ${q ? '' : 'disabled'}" data-act="shopsell" data-id="${sp.id}">판매<br><small>+${fmt(q * up)}</small></button>
    </div>`;
  }).join('');
  const tabs = [['all', '전체', '#7a4f2e'], ...CAT_KEYS.map(c => [c, CATS[c].name, CATS[c].color])]
    .map(([k, n, col]) => `<button data-act="shoptab" data-tab="${k}" class="tab ${SHOP.tab === k ? 'on' : ''}" style="--c:${col}">${n} ${fmt(invTotal(k === 'all' ? null : k))}</button>`).join('');
  const tabVal = invValue(SHOP.tab === 'all' ? null : SHOP.tab);
  openModal(`
    <h2>🍄 버섯 상점</h2>
    <div class="tabs modes">${shopModeTabs()}</div>
    <div class="sub">창고에 쌓인 버섯을 원하는 개수만큼 팔아 골드로 바꿔요. 팔아도 <b>도감 기록과 별은 그대로</b> 남아요.
      판매가 = 등급 기본가(일반 1 · 에픽 3 · 유니크 10 · 레전드리 40) × 판매가 보너스 ×${fmtN(pm)}</div>
    <div class="res-mini"><span><img src="${iconURL('gold', 24)}">${fmt(G.gold)}</span>${G.tax.debt > 0 ? `<span class="debt">체납 ${fmt(G.tax.debt)}</span>` : ''}</div>
    <div class="tabs">${tabs}</div>
    <div class="shoplist" id="shoplist">${rows || '<div class="shop-empty">팔 버섯이 없어요. 수확하러 가 볼까요?</div>'}</div>
    <div class="shop-foot">
      <span>이 탭 전체 가치 ≈ <b>${fmt(tabVal)}</b>골드</span>
      <button class="go ${tabVal >= 1 ? '' : 'disabled'}" data-act="shopsellall">이 탭 버섯 전부 팔기</button>
    </div>`, 'shop', () => { const f = SHOP.onClose; SHOP.onClose = null; SHOP.q = {}; updateTopbar(); if (f) f(); });
  const l = $('shoplist'); if (l) l.scrollTop = keepScroll;
}
// 수량만 바뀌면 그 줄만 갱신 (슬라이더를 끄는 중에 화면 전체를 다시 그리지 않도록)
function shopRefreshRow(id) {
  const row = document.querySelector(`.shoprow[data-id="${id}"]`); if (!row) return;
  const q = shopQ(id), up = unitPrice(SP[id]);
  row.querySelectorAll('input').forEach(i => { if (+i.value !== q) i.value = q; });
  const b = row.querySelector('.sh-sell');
  b.innerHTML = `판매<br><small>+${fmt(q * up)}</small>`; b.classList.toggle('disabled', !q);
}
function sellMush(ids) {
  const pm = priceMul();
  let gold = 0, n = 0;
  for (const [id, cnt] of ids) {
    const k = Math.min(Math.floor(cnt), invCount(id));
    if (k < 1) continue;
    G.inv[id] -= k; if (G.inv[id] < 1e-9) delete G.inv[id];
    gold += k * unitPrice(SP[id], pm); n += k;
    delete SHOP.q[id];
  }
  if (!n) { Snd.err(); return; }
  gold = Math.floor(gold);
  const debt = gainGold(gold);
  saveGame(); Snd.buy();
  toast(`버섯 ${fmt(n)}개 판매 +${fmt(gold)}골드${debt ? ` (체납 ${fmt(debt)} 차감)` : ''}`);
  openShop();
}

// ===== 정산 (점수 → 골드, 수확한 버섯 → 창고, 체납 차감) =====
// 버섯은 자동으로 팔리지 않고 창고(G.inv)에 쌓인다. 버섯 상점에서 원하는 개수만큼 판다.
// 세금 기준 수익(G.tax.income) = 점수 골드 + 특수 버섯 보너스 + 수확한 버섯의 가치(팔았는지와 무관)
//   → 버섯을 쌓아 두었다가 세금 뒤에 파는 식으로 세금을 피할 수 없다.
function finishRound() {
  const st = R.st;
  const scoreGold = Math.floor(R.score * st.goldMul);
  const bonusGold = Math.floor(R.bonusGold);
  const value = Math.floor(R.value);
  const debtTaken = gainGold(scoreGold + bonusGold);
  const net = scoreGold + bonusGold - debtTaken;
  for (const id in R.bag) G.inv[id] = (G.inv[id] || 0) + R.bag[id];
  const recs = [];
  const cur = { score: R.score, combo: R.maxCombo, harvest: R.harvests, balls: R.maxBalls, chain: R.maxChain };
  for (const k in cur) if (cur[k] > G.rec[k]) { recs.push({ k, old: G.rec[k], v: cur[k] }); G.rec[k] = cur[k]; }
  G.tax.income += scoreGold + bonusGold + value;
  G.tax.roundsIn++;
  G.rounds++;
  if (goldenCount() >= 15 && !G.hv.gold) { G.hv.gold = 1; G.hvOn.gold = true; recs.push({ k: 'goldhv' }); }
  // 10스테이지마다 새 지역: 열리면 다음 라운드 지역으로 자동 선택
  const newTheme = THEMES.find(t => t.from > 1 && t.from === stageNow()) || null;
  if (newTheme) G.theme = newTheme.id;
  const unlocks = checkUnlocks();
  saveGame();
  const sum = {
    score: R.score, scoreGold, bonusGold, value, debtTaken, net, goldMul: st.goldMul, gains: Object.assign({}, R.gains),
    newSpecies: R.newSpecies.slice(), newGolden: R.newGolden.slice(), newStars: R.newStars.slice(), specialGot: R.specialGot,
    unlocks, recs, harvests: R.harvests, newTheme: newTheme && newTheme.id, coinGold: Math.floor(R.coinGold),
  };
  R = null;
  showSettlement(sum);
}
function showSettlement(s) {

  const due = G.tax.roundsIn >= TAX.every;
  $('screen').innerHTML = `
    <div class="settle">

      <div class="sgains">${CAT_KEYS.map(c => `<div class="sg" style="--c:${CATS[c].color}"><img src="${iconURL(c, 40)}"><span>${CATS[c].name}</span><b>+${fmt(s.gains[c])}개</b></div>`).join('')}</div>
      <div class="srow"><span>🍄 창고로 들어간 버섯 가치 <small>(상점에서 팔면 골드)</small></span><b id="s-sale">0</b></div>
      <div class="srow"><span>얻은 점수 → 골드 <small>(×${fmtN(s.goldMul)})</small></span><b id="s-score">0</b></div>
      ${s.bonusGold ? `<div class="srow"><span>보너스 골드 <small>(엽전 수확기 ${fmt(s.coinGold)} · 특수 버섯 ${fmt(s.bonusGold - s.coinGold)})</small></span><b>+${fmt(s.bonusGold)}</b></div>` : ''}
      ${s.debtTaken ? `<div class="srow debt"><span>체납금 자동 차감</span><b>−${fmt(s.debtTaken)}</b></div>` : ''}
      <div class="srow gold"><span>받은 골드</span><b id="s-gold"><img src="${iconURL('gold', 34)}">0</b></div>
      <div class="smeta">창고 ${fmt(invTotal())}개 (≈${fmt(invValue())}골드) · ${due ? '🧾 세금 고지서가 도착했어요!' : `세금 청구까지 ${taxRoundsLeft()}라운드`}</div>
      ${s.newTheme ? `<div class="newtheme">${THEME[s.newTheme].icon} 새 지역 열림: <b>${THEME[s.newTheme].n}</b><small>${THEME[s.newTheme].d} · 다음 라운드부터 이 지역으로 가요</small></div>` : ''}
      ${unl ? `<div class="snew"><div class="snh">🌱 새로 해금된 버섯 (다음 라운드부터 등장)</div><div class="newcards">${unl}</div></div>` : ''}
      ${newc ? `<div class="snew"><div class="snh">도감 소식</div><div class="newcards">${newc}</div></div>` : ''}
      ${recs ? `<div class="srecs">${recs}</div>` : ''}
      <div class="settle-btns">
        <button class="big" data-act="shop">🍄 버섯 상점</button>
        <button class="big go" data-act="totree">${due ? '세금 고지서 확인 ▶' : '균사 트리로 ▶'}</button>
      </div>
    </div>`;
  // 바구니에 버섯이 후두둑
  const basket = $('basket');
  const pool = [];
  for (const c of CAT_KEYS) { const n = Math.min(14, Math.ceil(Math.sqrt(s.gains[c]))); for (let i = 0; i < n; i++) pool.push(c); }
  pool.sort(() => Math.random() - 0.5);
  pool.forEach((c, i) => {
    const sp = pick(SPECIES.filter(x => x.c === c && harvested(x.id))) || SPECIES.find(x => x.c === c);
    const im = document.createElement('img'); im.src = shroomURL(sp, 22); im.className = 'bshroom';
    im.style.left = (20 + Math.random() * 300) + 'px'; im.style.animationDelay = (i * 0.04) + 's';
    im.style.setProperty('--y', (60 - Math.random() * 40) + 'px');
    basket.appendChild(im);
  });
  // 롤링 카운터
  const t0 = performance.now();
  const roll = () => {
    const ease = d => { const k = clamp((performance.now() - t0 - d) / 1100, 0, 1); return 1 - Math.pow(1 - k, 3); };
    const a = $('s-score'), b = $('s-sale'), g = $('s-gold'); if (!a) return;

    if (e3 < 1) requestAnimationFrame(roll); else Snd.buy();
  };
  requestAnimationFrame(roll);
}

function nextTaxUnlock() { return SPECIES.filter(s => s.tax && s.tax > G.tax.paid).sort((a, b) => a.tax - b.tax)[0] || null; }
// head: 결과 화면에서 보여 줄 (방금 끝난) 사이클 정보
function showTaxBill(result, head) {
  setScreen('tax');

  if (result) {
    body = `${result}<button class="big go" data-act="aftertax">균사 트리로 ▶</button>`;

      <div class="srow"><span>납부할 세금 <small>(수익의 ${Math.round(TAX.share * 100)}% · 최소 ${fmt(taxAmount(T.cycle))}${setDone('tax') ? ' · 성실 납세자 −20%' : ''})</small></span><b><img src="${iconURL('gold', 34)}">${fmt(bill)}</b></div>
      <div class="srow"><span>보유 골드</span><b class="${canPay ? '' : 'lack'}">${fmt(G.gold)}</b></div>
      ${invTotal() ? `<div class="srow"><span>창고 버섯 ${fmt(invTotal())}개 <small>(≈${fmt(invValue())}골드)</small></span><button data-act="shop">🍄 팔러 가기</button></div>` : ''}
      <div class="taxopts">
        <div class="topt">
          <button class="big go ${canPay ? '' : 'disabled'}" data-act="taxpay">납부하기</button>
          <div class="tnote">−${fmt(bill)}골드 · 납부 ${T.paid + 1}회째${nu ? `<br>🧾 세금 ${nu.tax}회 납부 시 <b>${nu.tax === T.paid + 1 ? nu.n : '새 버섯'}</b> 해금` : ''}</div>
        </div>
        <div class="topt">
          <button class="big danger" data-act="taxskip">미납하기</button>
          <div class="tnote">이번 사이클 수익의 <b>${Math.round(rate * 100)}%</b> (−${fmt(penalty)}골드) 차감<br>미납 ${T.unpaid + 1}회째 · 다음 미납은 ${Math.round(taxRate(T.unpaid + 1) * 100)}%${penalty > G.gold ? '<br>골드가 모자란 만큼은 체납금으로 다음 수익에서 떼어 가요' : ''}</div>
        </div>
      </div>`;
  }
  $('screen').innerHTML = `
    <div class="settle taxbill">
      <h1>🧾 세금 고지서</h1>
      <div class="sub">사이클 ${head ? head.cycle : T.cycle} · ${TAX.every}라운드 동안 번 골드 <b>${fmt(head ? head.income : T.income)}</b></div>
      ${body}
    </div>`;
}
function taxPay() {
  const bill = taxBill();
  if (G.gold < bill) { Snd.err(); toast('골드가 모자라요'); return; }
  const head = { cycle: G.tax.cycle, income: G.tax.income };
  G.gold -= bill; G.tax.paid++;
  const unl = checkUnlocks();
  nextTaxCycle();
  Snd.record();
  showTaxBill(`<div class="tresult ok">납부 완료! <small>(누적 ${G.tax.paid}회)</small></div>
    ${unl.length ? `<div class="snew"><div class="snh">🧾 세금 납부로 해금된 버섯</div><div class="newcards">${unl.map(id => `<div class="newcard unlock"><img src="${shroomURL(SP[id], 34)}"><span>${SP[id].n}</span><i>해금</i></div>`).join('')}</div></div>` : ''}
    <div class="smeta">다음 세금: 사이클 ${G.tax.cycle} · ${TAX.every}라운드 뒤 · 그 사이클 수익의 ${Math.round(TAX.share * 100)}% (최소 ${fmt(taxAmount(G.tax.cycle))})</div>`, head);
}
function taxSkip() {
  const T = G.tax, rate = taxRate(T.unpaid), penalty = Math.ceil(T.income * rate);
  const head = { cycle: T.cycle, income: T.income };
  const take = Math.min(G.gold, penalty);
  G.gold -= take; T.debt += penalty - take; T.unpaid++;
  nextTaxCycle();
  Snd.err();
  showTaxBill(`<div class="tresult bad">미납… 수익의 ${Math.round(rate * 100)}% (−${fmt(penalty)}골드)를 떼어 갔어요</div>
    ${penalty > take ? `<div class="smeta">모자란 ${fmt(penalty - take)}골드는 체납금으로 다음 라운드 수익에서 자동 차감돼요</div>` : ''}
    <div class="smeta">다음 미납 시 ${Math.round(taxRate(T.unpaid) * 100)}% 차감 · 다음 세금: 사이클 ${G.tax.cycle} (최소 ${fmt(taxAmount(G.tax.cycle))})</div>`, head);
}
function nextTaxCycle() {
  G.tax.cycle++; G.tax.roundsIn = 0; G.tax.income = 0;
  G.quests = []; refreshQuests();   // 마을 의뢰 새로 받기
  saveGame();
}

  setScreen('cutscene');
  CUT.t = 0;
  $('screen').innerHTML = `<div class="cutscene"><div class="cut-cap" id="cutcap"></div><button class="ghost small cut-skip" data-act="cutskip">건너뛰기 ▶▶</button></div>`;
  Snd.record();
}
function drawCutscene(ctx, dt) {
  CUT.t += dt;
  const t = CUT.t, now = performance.now() / 1000;
  const restore = clamp((t - 6.5) / 3, 0, 1);       // 0 = 버섯 마을, 1 = 되찾은 마을
  drawTown(ctx, now, 1 - restore, restore);
  const gx = t < 3.5 ? -300 + t * 120 : lerp(120, 420, clamp((t - 3.5) / 2, 0, 1));
  drawGrandpa(ctx, gx + 200, 1010, 1.6, now, t > 3 && t < 7);
  if (t >= 10.5) {
    // 도감 60종이 할아버지 주위를 빙글
    const k = clamp((t - 10.5) / 1.2, 0, 1);
    SPECIES.forEach((sp, i) => {
      const a = i / SP_TOTAL * TAU + now * 0.3, rr = 380 * k;
      const spr = shroomSprite(sp, 22, G.codex[sp.id] && G.codex[sp.id].gold, 0);
      ctx.globalAlpha = k; ctx.drawImage(spr, 1100 + Math.cos(a) * rr - spr.width / 2, 520 + Math.sin(a) * rr * 0.75 - spr.height / 2); ctx.globalAlpha = 1;
    });
  }
  let line = '';
  for (const [s, l] of CUT_LINES) if (t >= s) line = l;
  const cap = $('cutcap'); if (cap && cap.textContent !== line) cap.textContent = line;
  const fade = t < 0.6 ? 1 - t / 0.6 : t > CUT.dur - 0.6 ? (t - (CUT.dur - 0.6)) / 0.6 : 0;
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  if (t >= CUT.dur) showEnding();
}
function showEnding() {
  setScreen('ending');
  const icons = SPECIES.map(s => `<img src="${shroomURL(s, 22, G.codex[s.id] && G.codex[s.id].gold)}">`).join('');
  $('screen').innerHTML = `
    <div class="ending">
      <h1>도감 완성!</h1>
      <div class="sub">거대 버섯 ${SP_TOTAL}종을 모두 수확해 마을을 되찾았어요.</div>
      <div class="allicons">${icons}</div>
      <div class="srow"><span>총 라운드</span><b>${G.rounds}</b></div>
      <div class="srow"><span>세금</span><b>납부 ${G.tax.paid} · 미납 ${G.tax.unpaid}</b></div>
      <div class="srow"><span>플레이 시간</span><b>${fmtTime(G.play)}</b></div>
      <div class="srow"><span>황금 변종</span><b>${goldenCount()}/${SP_TOTAL}</b></div>
      <button class="big go" data-act="totree2">계속 수확하기 ▶</button>
    </div>`;
}

function onAction(act, el) {
  Snd.init();
  switch (act) {
    case 'close': Snd.ui(); closeModal(); break;
    case 'newgame': G = newSave(); saveGame(); Snd.ui(); enterTree(); toast(`균사 트리에서 강화를 사거나 바로 수확하러 가 보세요! 세금은 ${TAX.every}라운드마다 나와요`); break;
    case 'continue': G = loadSave() || newSave(); Snd.ui(); enterTree(); break;
    case 'reset':
      openModal(`<h2>초기화</h2><div class="sub">저장된 진행을 모두 지울까요? 되돌릴 수 없어요.</div>
        <div class="pause-btns"><button class="big danger" data-act="reset-yes">모두 지우기</button><button data-act="close" class="ghost">취소</button></div>`, 'pause');
      break;
    case 'reset-yes': wipeSave(); G = null; closeModal(); renderTitle(); toast('초기화했어요'); break;
    case 'title': saveGame(); renderTitle(); break;
    case 'records': Snd.ui(); openRecords(); break;
    case 'codex': Snd.ui(); codexSel = null; openCodex(false); break;
    case 'codexsel': Snd.ui(); codexSel = el.dataset.id; openCodex(SCREEN === 'round'); break;
    case 'workshop': Snd.ui(); openWorkshop(); break;
    case 'bulk': Snd.ui(); openBulk(); break;
    case 'bulktab': Snd.ui(); BULK.br = el.dataset.tab; openBulk(); break;
    case 'bulkkeep': BULK.keep = el.checked; openBulk(); break;
    case 'bulkgo': doBulk(); break;
    case 'shop': Snd.ui(); SHOP.q = {}; openShop(null, SCREEN === 'tax' ? () => showTaxBill() : null); break;
    case 'shoptab': Snd.ui(); openShop(el.dataset.tab); break;
    case 'shopmode': Snd.ui(); SHOP.mode = el.dataset.mode; openShop(); break;
    case 'cook': cook(el.dataset.id); break;
    case 'cookall': cookAll(); break;
    case 'questall': questAll(); break;
    case 'quest': doQuest(+el.dataset.i); break;
    case 'shopq': SHOP.q[el.dataset.id] = shopQ(el.dataset.id) + +el.dataset.d; Snd.ui(); shopRefreshRow(el.dataset.id); break;
    case 'shopset': SHOP.q[el.dataset.id] = Math.floor(invCount(el.dataset.id) * +el.dataset.f); Snd.ui(); shopRefreshRow(el.dataset.id); break;
    case 'shopsell': sellMush([[el.dataset.id, shopQ(el.dataset.id)]]); break;
    case 'shopsellall': sellMush(shopList().map(sp => [sp.id, invCount(sp.id)])); break;
    case 'hvunlock': hvUnlock(el.dataset.id); break;
    case 'hvlevel': hvLevel(el.dataset.id); break;
    case 'go': Snd.ui(); openPreRound(); break;
    case 'pretheme': Snd.ui(); G.theme = el.dataset.id; saveGame(); renderPreRound(); break;
    case 'startround': beginRound(); break;
    case 'hvtoggle': hvToggle(el.dataset.id); break;
    case 'resume': closeModal(); break;
    case 'endnow': closeModal(); if (R) { R.timeLeft = 0; R.phase = 'end'; R.endT = 0.01; } break;
    case 'mute': Snd.muted = el.checked; break;
    case 'totree': Snd.ui(); afterSettle(); break;
    case 'totree2': Snd.ui(); enterTree(); break;
    case 'taxpay': taxPay(); break;
    case 'taxskip': taxSkip(); break;
    case 'aftertax': Snd.ui(); afterTax(); break;
    case 'cutskip': showEnding(); break;
    case 'dbg-res': if (G) { G.gold = Math.max(G.gold, 100) * 1000; saveGame(); updateTopbar(); toast('골드 ×1000'); } break;
    case 'dbg-spd': DBG.speed = +el.dataset.s; renderDebug(); break;
    case 'dbg-seeds': DBG.allSeeds = !DBG.allSeeds; if (G && DBG.allSeeds) { SPECIES.forEach(s => { if (!s.init) G.seeds[s.id] = true; }); saveGame(); } renderDebug(); updateTopbar(); break;
    case 'dbg-inf': DBG.infinite = !DBG.infinite; renderDebug(); break;
    case 'dbg-special': if (R && R.phase === 'run' && !R.special) spawnSpecial(); else toast('라운드 진행 중에만 소환할 수 있어요'); break;
    case 'dbg-tax': if (G) { G.tax.roundsIn = TAX.every - 1; saveGame(); updateTopbar(); toast('다음 정산 때 세금이 청구돼요'); } break;
    case 'dbg-cut': if (G) startCutscene(); break;
    case 'dbg-stage': if (G) { G.rounds += 10; G.theme = latestTheme().id; checkUnlocks(); saveGame(); updateTopbar(); toast(`스테이지 ${stageNow()} · ${latestTheme().n}`); } break;
    case 'dbg-preset': applyPreset(el.dataset.p); renderDebug(); toast(`밸런스: ${TUNE.n} (다음 라운드부터)`); break;
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let SCALE = 1, OFF = { x: 0, y: 0 };

function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  SCALE = Math.min(w / W, h / H);
  OFF.x = (w - W * SCALE) / 2; OFF.y = (h - H * SCALE) / 2;
  stage.style.transform = `translate(${OFF.x}px, ${OFF.y}px) scale(${SCALE})`;
}
function domToStage(cx, cy) { return { x: (cx - OFF.x) / SCALE, y: (cy - OFF.y) / SCALE }; }
window.addEventListener('resize', fit);
fit();

// 클릭 위임

cv.addEventListener('mousedown', e => {

    if (p.x >= cb.x && p.x <= cb.x + cb.w && p.y >= cb.y && p.y <= cb.y + cb.h) { R.paused = true; codexSel = null; openCodex(true); return; }
    const q = { x: p.x / ZOOM, y: p.y / ZOOM };   // 필드 좌표
    if (R.phase === 'aim' && d2(q.x, q.y, LAUNCH.x, LAUNCH.y) < 160 * 160) R.aim = { sx: q.x, sy: q.y, x: q.x, y: q.y };
  }
