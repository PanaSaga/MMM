// ===== 버섯 아포칼립스 마을 (비주얼 기획서: 거대 버섯이 마을을 침범한 세계) =====
// shroomK: 거대 버섯 크기(1 = 뒤덮임, 0 = 사라짐) · dawn: 하늘 밝기(0 = 흐린 보랏빛, 1 = 맑은 아침)
const TOWN = { houses: null, giants: null, spores: null };
function drawTown(g, now, shroomK = 1, dawn = 0) {
  if (!TOWN.houses) {
    const rnd = seeded(77);
    TOWN.houses = [];
    for (let x = -40; x < W + 40;) { const w = 120 + rnd() * 110, h = 140 + rnd() * 170; TOWN.houses.push({ x, w, h, roof: rnd() < 0.6, broken: rnd() < 0.4, col: 40 + rnd() * 25, win: rnd() }); x += w + 10 + rnd() * 30; }
    TOWN.giants = [
      { x: 260, h: 640, r: 230, c: '#d9271c', c2: '#ffffff', dots: 1 },
      { x: 760, h: 460, r: 170, c: '#9b7cc4', c2: '#dccbef' },
      { x: 1180, h: 720, r: 260, c: '#f28a22', c2: '#f7d44a' },
      { x: 1620, h: 520, r: 200, c: '#3fae4a', c2: '#d2f2cf', dots: 1 },
      { x: 1890, h: 380, r: 150, c: '#8b5a3a', c2: '#f1e6d4' },
    ];
    TOWN.spores = Array.from({ length: 60 }, () => ({ x: rnd() * W, y: rnd() * H, s: 2 + rnd() * 4, p: rnd() * 6 }));
  }
  // 하늘
  const sky = g.createLinearGradient(0, 0, 0, H);
  const top = dawn ? `rgb(${lerp(60, 120, dawn)},${lerp(40, 190, dawn)},${lerp(90, 245, dawn)})` : '#3c2858';
  const bot = dawn ? `rgb(${lerp(180, 255, dawn)},${lerp(110, 220, dawn)},${lerp(120, 160, dawn)})` : '#b46a78';
  sky.addColorStop(0, top); sky.addColorStop(1, bot);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  if (dawn > 0) { const sg = g.createRadialGradient(1500, 300, 20, 1500, 300, 260); sg.addColorStop(0, `rgba(255,245,200,${dawn})`); sg.addColorStop(1, 'rgba(255,245,200,0)'); g.fillStyle = sg; g.beginPath(); g.arc(1500, 300, 260, 0, TAU); g.fill(); }
  // 먼 언덕
  g.fillStyle = dawn ? `rgba(70,110,80,${0.6 + 0.4 * dawn})` : '#4a3550';
  g.beginPath(); g.moveTo(0, 720); for (let x = 0; x <= W; x += 80) g.lineTo(x, 700 - Math.sin(x / 260) * 60 - Math.cos(x / 130) * 20); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  // 거대 버섯 (집 뒤)
  const baseY = 900;
  for (const gm of TOWN.giants) {
    const k = shroomK; if (k <= 0.01) continue;
    const h = gm.h * k, r = gm.r * k, sway = Math.sin(now * 0.6 + gm.x) * 4 * k;
    g.save(); g.translate(gm.x, baseY);
    g.fillStyle = '#efe2c8'; g.strokeStyle = '#2a1a20'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(-r * 0.22, 0); g.quadraticCurveTo(-r * 0.3 + sway, -h * 0.5, -r * 0.16 + sway, -h); g.lineTo(r * 0.16 + sway, -h); g.quadraticCurveTo(r * 0.3 + sway, -h * 0.5, r * 0.22, 0); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(sway, -h, r, r * 0.62, 0, Math.PI, 0); g.quadraticCurveTo(sway, -h + r * 0.18, -r + sway, -h); g.closePath();
    g.fillStyle = gm.c; g.fill(); g.stroke();
    if (gm.dots) { g.fillStyle = gm.c2; for (const [dx, dy, s] of [[-0.5, -0.3, 0.12], [0.1, -0.5, 0.1], [0.5, -0.25, 0.11], [-0.1, -0.2, 0.07]]) { g.beginPath(); g.arc(sway + dx * r, -h + dy * r, s * r, 0, TAU); g.fill(); } }
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.ellipse(sway - r * 0.4, -h - r * 0.35, r * 0.3, r * 0.1, -0.4, 0, TAU); g.fill();
    g.restore();
  }
  // 마을 집 (덩굴·버섯이 덮은 폐허)
  for (const hs of TOWN.houses) {
    const y = baseY - hs.h, c = hs.col;
    g.fillStyle = dawn ? `rgb(${c + 90 * dawn},${c + 60 * dawn},${c + 40 * dawn})` : `rgb(${c},${c - 8},${c + 10})`;
    g.strokeStyle = '#1e141a'; g.lineWidth = 4;
    g.fillRect(hs.x, y, hs.w, hs.h); g.strokeRect(hs.x, y, hs.w, hs.h);
    if (hs.roof) { g.beginPath(); g.moveTo(hs.x - 12, y); g.lineTo(hs.x + hs.w / 2, y - 60 - (hs.broken ? -14 : 0)); g.lineTo(hs.x + hs.w + 12, y); g.closePath(); g.fillStyle = dawn ? '#a5584a' : '#3a2230'; g.fill(); g.stroke(); }
    g.fillStyle = dawn ? 'rgba(255,230,150,0.85)' : hs.win > 0.6 ? 'rgba(255,200,110,0.6)' : 'rgba(20,10,20,0.7)';
    for (let wy = y + 30; wy < baseY - 50; wy += 60) for (let wx = hs.x + 20; wx < hs.x + hs.w - 30; wx += 50) g.fillRect(wx, wy, 22, 28);
    if (shroomK > 0.2) { // 지붕 위 작은 버섯
      g.fillStyle = hs.win > 0.5 ? '#e0252f' : '#f6da0c';
      g.beginPath(); g.ellipse(hs.x + hs.w * 0.7, y - 4, 14 * shroomK, 10 * shroomK, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#5a8a3a'; g.fillRect(hs.x, y, hs.w * 0.3, 6);
    }
  }
  // 땅
  g.fillStyle = dawn ? '#6a9a4a' : '#3a2a2a'; g.fillRect(0, baseY, W, H - baseY);
  g.fillStyle = dawn ? '#5a8a3a' : '#2e2024'; g.fillRect(0, baseY, W, 14);
  // 떠다니는 포자
  for (const s of TOWN.spores) {
    const y = (s.y - now * 20 * s.s) % H, yy = y < 0 ? y + H : y;
    g.fillStyle = `rgba(255,235,200,${0.25 * shroomK + 0.05})`; g.beginPath(); g.arc(s.x + Math.sin(now + s.p) * 20, yy, s.s, 0, TAU); g.fill();
  }
}
function drawTitleBg(now) {
  const saved = SCREEN === 'ending';   // 엔딩 화면에서는 버섯이 걷힌 마을
  drawTown(ctx, now, saved ? 0 : 1, saved ? 1 : 0);
  drawGrandpa(ctx, 250, 1020, 2.2, now, Math.sin(now * 0.8) > 0.3);
  // 튕겨 다니는 낫 수확기
  const t = now * 0.6;
  ctx.save(); ctx.translate(960 + Math.cos(t) * 760, 540 + Math.sin(t * 1.3) * 400);
  drawHarvester(ctx, 'sam', 26, now * 8); ctx.restore();
}

let last = performance.now();
let fpsAcc = 0, fpsN = 0, fps = 60;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (G && SCREEN !== 'title') G.play += dt;
  const ts = now / 1000;
  if (SCREEN === 'round' && R) {
    // 바는 마우스 x를 부드럽게 따라감
    const target = clamp(MOUSE.x / ZOOM, FX0 + R.bar.len / 2, FX1 - R.bar.len / 2);
    if (!R.paused) R.bar.x = lerp(R.bar.x, target, 1 - Math.exp(-18 * dt));
    if (!R.paused && !modalOpen()) {
      if (R.hitstop > 0) R.hitstop -= dt;
      else {
        let total = dt * SPEED * DBG.speed;
        while (total > 1e-6 && R) { const h = Math.min(total, 1 / 60); simFrame(h); total -= h; }
      }
    }
    if (R) {
      drawRound(ctx);
      if (R.phase === 'end' && R.endT <= 0) finishRound();
    }
  } else if (SCREEN === 'tree') {
    drawTree(ctx, dt);
  } else if (SCREEN === 'cutscene') {
    drawCutscene(ctx, dt);
  } else {
    drawTitleBg(ts);
  }
  if (DBG.open) { const di = document.getElementById('dinfo'); if (di) di.textContent = `FPS ${fps}${R ? ` · 핀볼 ${R.balls.length} · 버섯 ${R.shrooms.length} · 군락지 ${R.colonies.length}/${R.st.maxCol}` : ''}`; }
  requestAnimationFrame(loop);
}
